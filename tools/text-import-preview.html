<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Text OCR Import Preview</title>
    <script>
      if (new URLSearchParams(location.search).get("embedded") === "1") {
        document.documentElement.classList.add("embedded");
      }
    </script>
    <style>
      :root {
        color-scheme: light;
        --bg: #f6f7f8;
        --panel: #ffffff;
        --line: #d9dee5;
        --text: #17202a;
        --muted: #657181;
        --accent: #1f6f8b;
        --accent-soft: #e7f1f7;
        --scene: #fff7e8;
        --scene-line: #efc46b;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 14px 20px;
        border-bottom: 1px solid var(--line);
        background: var(--panel);
        position: sticky;
        top: 0;
        z-index: 10;
      }

      h1,
      h2,
      h3 {
        margin: 0;
        letter-spacing: 0;
      }

      h1 {
        font-size: 18px;
      }

      h2 {
        font-size: 22px;
      }

      h3 {
        font-size: 15px;
      }

      a {
        color: var(--accent);
        text-decoration: none;
      }

      button,
      input::file-selector-button {
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--panel);
        color: var(--text);
        cursor: pointer;
        font: inherit;
        padding: 8px 12px;
      }

      button.primary {
        border-color: var(--accent);
        background: var(--accent);
        color: #fff;
      }

      .workspace {
        display: grid;
        grid-template-columns: minmax(500px, 1fr) minmax(360px, 0.95fr);
        gap: 16px;
        padding: 16px;
        align-items: start;
      }

      .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
      }

      .data-panel {
        padding: 16px;
      }

      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
        margin-bottom: 14px;
      }

      .summary,
      .status {
        color: var(--muted);
        font-size: 13px;
      }

      .summary {
        margin-left: auto;
      }

      .lesson-row {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 0 0 14px;
      }

      .lesson-title {
        color: var(--muted);
        font-size: 13px;
        white-space: nowrap;
      }

      .lesson-list {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .lesson-chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        min-height: 32px;
        padding: 5px 10px;
        border-radius: 999px;
        font-size: 13px;
      }

      .lesson-chip.active {
        border-color: var(--accent);
        background: var(--accent-soft);
        color: var(--accent);
      }

      .lesson-chip .count {
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }

      .status {
        min-height: 20px;
        margin-bottom: 12px;
      }

      .status.error {
        color: #b42318;
      }

      details {
        border: 1px solid var(--line);
        border-radius: 8px;
        margin-bottom: 16px;
        overflow: hidden;
      }

      summary {
        cursor: pointer;
        padding: 10px 12px;
        color: var(--muted);
      }

      textarea {
        display: block;
        width: 100%;
        min-height: 180px;
        border: 0;
        border-top: 1px solid var(--line);
        resize: vertical;
        padding: 12px;
        font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }

      .text-section {
        border: 1px solid var(--line);
        border-radius: 8px;
        margin-bottom: 16px;
        overflow: hidden;
      }

      .section-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        background: #fbfcfd;
        padding: 12px 14px;
        user-select: none;
        transition: background 0.16s ease, color 0.16s ease;
      }

      .text-section.expanded .section-head {
        border-bottom: 1px solid var(--line);
        background: var(--accent-soft);
        color: var(--accent);
      }

      .section-label {
        color: var(--muted);
        font-size: 13px;
      }

      .text-vocabulary-debug {
        padding: 10px 14px;
        border-bottom: 1px solid var(--line);
        background: #f5fbfd;
        color: #24556b;
      }

      .text-vocabulary-toggle {
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 100%;
        padding: 0;
        border: 0;
        background: transparent;
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
        text-align: left;
      }

      .text-vocabulary-toggle strong { color: var(--accent); }
      .text-vocabulary-toggle:hover strong,
      .text-vocabulary-toggle:focus-visible strong { text-decoration: underline; }

      .text-vocabulary-items {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 8px;
      }

      .text-vocabulary-chip {
        position: relative;
        display: inline-flex;
        align-items: flex-end;
        gap: 6px;
        min-height: 31px;
        border: 1px solid var(--line);
        border-radius: 9px;
        background: #fff;
        color: var(--text);
        padding: 5px 27px 5px 9px;
        cursor: pointer;
        font: inherit;
        font-size: 15px;
        transition: border-color 0.16s ease, background 0.16s ease, color 0.16s ease;
      }

      .text-vocabulary-chip:hover,
      .text-vocabulary-chip:focus-visible,
      .text-vocabulary-chip.playing {
        border-color: var(--accent);
        outline: none;
      }

      .text-vocabulary-chip rt {
        color: var(--muted);
        font-size: 0.72em;
      }

      .text-vocabulary-meaning {
        color: var(--muted);
        font-size: 12px;
      }

      .text-vocabulary-pos {
        position: absolute;
        top: 3px;
        right: 4px;
        min-width: 17px;
        padding: 1px 3px;
        border-radius: 4px;
        background: #0f766e;
        color: #fff;
        font-size: 10px;
        font-weight: 850;
        line-height: 13px;
        text-align: center;
        pointer-events: none;
      }

      .section-actions {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
        justify-content: flex-end;
      }

      .section-toggle,
      .section-display-toggle {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-width: 64px;
        justify-content: center;
        padding: 3px 8px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: #fff;
        color: var(--muted);
        font-size: 13px;
        font-weight: 700;
      }

      .section-toggle:hover,
      .section-display-toggle:hover {
        border-color: var(--accent);
        color: var(--accent);
      }

      .text-section.expanded .section-toggle {
        border-color: var(--accent);
        color: var(--accent);
      }

      .section-display-toggle {
        min-width: 54px;
      }

      .basic-sentences,
      .dialogue,
      .block {
        padding: 9px 12px;
      }

      .basic-sentences,
      .text-section[data-text-section="basic"] .dialogue,
      .application-scene-group {
        border-bottom: 1px solid #edf0f3;
      }

      .sentence {
        display: grid;
        grid-template-columns: 52px 1fr auto;
        gap: 8px;
        padding: 6px 0;
        align-items: start;
        cursor: pointer;
      }

      .num {
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }

      .jp {
        font-size: 16px;
        font-weight: 650;
        line-height: 1.45;
      }

      .jp ruby {
        ruby-position: over;
        ruby-align: center;
      }

      .jp rt {
        color: var(--muted);
        font-size: 0.56em;
        font-weight: 500;
        line-height: 1;
        user-select: none;
      }

      .jp .base-text {
        font-size: 16px;
        white-space: pre-wrap;
      }

      .kana,
      .cn,
      .raw {
        color: var(--muted);
        line-height: 1.5;
        margin-top: 2px;
      }

      .cn {
        color: #8a95a3;
      }

      .cn.text-only-translation {
        margin-top: 0;
      }

      .raw {
        font-size: 12px;
      }

      .dialogue-title {
        margin: 2px 0 5px;
        color: var(--accent);
      }

      .line {
        display: grid;
        grid-template-columns: 52px 1fr auto;
        gap: 8px;
        padding: 6px 0;
        align-items: start;
        cursor: pointer;
      }

      .text-cell {
        display: grid;
        gap: 8px;
        min-width: 0;
      }

      .speaker {
        display: inline;
        color: var(--accent);
        font-weight: 700;
      }

      .block.scene,
      .block.narration {
        margin: 7px 12px 2px;
        padding: 0;
      }

      .block.scene .cn,
      .block.narration .cn {
        color: #9ba4ae;
        font-size: 12px;
        font-style: italic;
        line-height: 1.45;
      }

      .audio-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 28px;
        height: 28px;
        padding: 0;
        border-color: var(--accent);
        color: var(--accent);
        background: var(--accent-soft);
        cursor: pointer;
        font-size: 14px;
        line-height: 1;
      }

      .segment-actions {
        display: flex;
        gap: 6px;
        align-items: center;
      }

      .segment-actions .audio-button,
      .segment-actions .text-ai-button {
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.16s ease;
      }

      .sentence:hover .segment-actions .audio-button,
      .line:hover .segment-actions .audio-button,
      .sentence:hover .segment-actions .text-ai-button,
      .line:hover .segment-actions .text-ai-button {
        opacity: 1;
        pointer-events: auto;
      }

      .text-ai-button {
        border-color: #d8ccec;
        background: #fbf8ff;
        color: #6b4c9a;
        cursor: pointer;
        font-size: 10px;
        font-weight: 900;
      }

      .text-ai-button.active {
        border-color: #b79bdd;
        background: #f0e9fb;
        color: #533579;
      }

      .text-ai-panel {
        display: grid;
        gap: 7px;
        max-width: 620px;
      }

      .text-ai-panel textarea {
        width: 100%;
        min-height: 38px;
        padding: 8px;
        border: 1px solid #bdd7c9;
        border-radius: 7px;
        resize: none;
        overflow: hidden;
        font: inherit;
        font-size: 13px;
        line-height: 1.55;
      }

      .text-ai-actions {
        display: flex;
        justify-content: flex-end;
        gap: 7px;
      }

      .text-ai-actions button {
        min-height: 30px;
        padding: 5px 9px;
        border: 1px solid #a8cdbc;
        border-radius: 6px;
        background: #fff;
        cursor: pointer;
        font: inherit;
        font-size: 12px;
      }

      .text-ai-actions button:disabled {
        cursor: default;
        opacity: 0.45;
      }

      .text-ai-panel small {
        color: var(--muted);
      }

      .text-ai-answer {
        padding: 8px;
        border: 1px solid #d9cbed;
        border-radius: 7px;
        background: #faf7ff;
        color: #43345e;
        font-size: 12px;
        line-height: 1.55;
      }

      .text-ai-answer p,
      .text-ai-saved pre {
        margin: 0;
        white-space: pre-wrap;
        font: 13px/1.55 inherit;
      }

      .text-ai-saved-list {
        display: grid;
        gap: 7px;
      }

      .text-ai-saved {
        position: relative;
        display: grid;
        gap: 7px;
        padding: 10px 34px 10px 12px;
        border: 1px solid #ddd3ea;
        border-radius: 8px;
        background: #faf7fd;
      }

      .text-ai-saved button {
        position: absolute;
        top: 7px;
        right: 7px;
        padding: 0;
        border: 0;
        background: transparent;
        color: #8d5e58;
        cursor: pointer;
      }

      .audio-review-status {
        max-width: 92px;
        overflow: hidden;
        border: 1px solid #5e9f77;
        border-radius: 4px;
        padding: 3px 5px;
        color: #23653f;
        background: #edf8f1;
        font-size: 11px;
        line-height: 1.15;
        white-space: nowrap;
        text-overflow: ellipsis;
      }

      .audio-review-status.pending {
        border-color: #d5962a;
        color: #8b5800;
        background: #fff7e7;
      }

      .segment-settings {
        display: inline-flex;
      }

      .audio-placeholder {
        width: 34px;
        height: 34px;
      }

      .modal-backdrop {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: none;
        place-items: center;
        padding: 20px;
        background: rgba(23, 32, 42, 0.38);
      }

      .modal-backdrop.open {
        display: grid;
      }

      .modal {
        width: min(100%, 460px);
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        box-shadow: 0 18px 56px rgba(23, 32, 42, 0.22);
      }

      .modal-head,
      .modal-actions {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 12px 14px;
        border-bottom: 1px solid var(--line);
      }

      .modal-actions {
        justify-content: flex-end;
        border-top: 1px solid var(--line);
        border-bottom: 0;
      }

      .modal-body {
        padding: 14px;
      }

      .modal-title {
        font-size: 15px;
        font-weight: 700;
      }

      .modal-text {
        margin: 0 0 12px;
        color: var(--muted);
        line-height: 1.5;
      }

      .time-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-bottom: 10px;
      }

      .time-grid label {
        display: grid;
        gap: 5px;
        color: var(--muted);
        font-size: 12px;
      }

      .time-grid input {
        width: 100%;
        height: 36px;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 0 9px;
        color: var(--text);
        font: inherit;
        font-variant-numeric: tabular-nums;
      }

      .modal-status {
        min-height: 20px;
        color: var(--muted);
        font-size: 13px;
      }

      .modal-status.error {
        color: #b42318;
      }

      .image-panel {
        position: sticky;
        top: 72px;
        padding: 12px;
      }

      .image-block + .image-block {
        margin-top: 14px;
      }

      .image-title {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        color: var(--muted);
        font-size: 13px;
        margin: 0 0 10px;
      }

      #status { display: none; }
      html:not(.admin) .segment-actions .audio-review-status,
      html:not(.admin) .segment-actions .segment-settings { display: none; }

      .source-image {
        display: block;
        width: 100%;
        height: auto;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #fff;
      }

      html.embedded header,
      html.embedded .data-panel > .toolbar,
      html.embedded .data-panel > .lesson-row,
      html.embedded .data-panel > details {
        display: none;
      }

      html.embedded .workspace {
        padding: 0;
      }

      html.embedded .panel {
        border-radius: 0;
      }

      html.embedded .data-panel {
        border-left: 0;
        border-top: 0;
        border-bottom: 0;
      }

      html.embedded .image-panel {
        top: 0;
        border-top: 0;
        border-right: 0;
        border-bottom: 0;
      }

      @media (max-width: 980px) {
        .workspace {
          grid-template-columns: 1fr;
        }

        .image-panel {
          position: static;
        }
      }

      @media (max-width: 640px) {
        html.embedded .image-panel { display: none; }
        .section-head { align-items: flex-start; gap: 8px; padding: 10px 11px; }
        .section-head h3 { margin: 0; font-size: 16px; line-height: 1.35; }
        .section-actions { gap: 4px; }
        .section-label { display: none; }
        .section-toggle, .section-display-toggle { min-width: 48px; padding: 3px 6px; font-size: 11px; }
        .dialogue { padding: 9px 11px; }
        .sentence, .line { grid-template-columns: 32px minmax(0, 1fr) auto; gap: 6px; padding: 6px 0; }
        .speaker { font-size: 12px; }
        .sentence .jp, .sentence .jp .base-text, .line .jp, .line .jp .base-text { font-size: 14px; line-height: 1.38; }
        .sentence .kana, .sentence .cn, .line .kana, .line .cn { margin-top: 2px; font-size: 13px; line-height: 1.35; }
        .sentence .segment-actions, .line .segment-actions { gap: 3px; }
        .sentence .segment-actions button, .line .segment-actions button { min-width: 26px; width: 26px; height: 26px; padding: 0; font-size: 11px; }
        .block.scene, .block.narration { margin: 8px 11px 2px; }
        .block.scene .cn, .block.narration .cn { margin-top: 0; font-size: 11px; line-height: 1.4; }
      }

      @media (hover: none) {
        .segment-actions .audio-button,
        .segment-actions .text-ai-button {
          opacity: 1;
          pointer-events: auto;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>课文 OCR 导入校对</h1>
      <nav><a href="./vocabulary-import-preview.html">单词导入校对</a></nav>
    </header>

    <main class="workspace">
      <section class="panel data-panel">
        <div class="toolbar">
          <button class="primary" id="loadDefault" type="button">重新加载当前课次</button>
          <button id="generateAudio" type="button">生成音频区间标注</button>
          <input id="fileInput" type="file" accept="application/json,.json" />
          <span class="summary" id="summary">未加载</span>
        </div>

        <div class="lesson-row">
          <span class="lesson-title">样例课次</span>
          <div class="lesson-list" id="lessonList"></div>
        </div>

        <details>
          <summary>手动粘贴 JSON 导入</summary>
          <textarea id="jsonInput" spellcheck="false" placeholder="粘贴 text OCR JSON"></textarea>
          <div class="toolbar" style="padding: 10px 12px;">
            <button id="parseInput" type="button">解析文本框</button>
          </div>
        </details>

        <div class="status" id="status"></div>
        <div id="textPreview"></div>
      </section>

      <aside class="panel image-panel" id="imagePanel"></aside>
    </main>

    <div class="modal-backdrop" id="segmentModal" aria-hidden="true">
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="segmentModalTitle">
        <div class="modal-head">
          <div class="modal-title" id="segmentModalTitle">设置音频区间</div>
          <button id="closeSegmentModal" type="button" aria-label="关闭">×</button>
        </div>
        <div class="modal-body">
          <p class="modal-text" id="segmentModalText"></p>
          <div class="time-grid">
            <label>开始时间（秒）<input id="segmentStart" type="number" min="0" step="0.001" /></label>
            <label>结束时间（秒）<input id="segmentEnd" type="number" min="0" step="0.001" /></label>
          </div>
          <div class="modal-status" id="segmentModalStatus"></div>
        </div>
        <div class="modal-actions">
          <button id="testSegmentPlay" type="button">测试播放</button>
          <button class="primary" id="saveSegment" type="button">保存</button>
        </div>
      </div>
    </div>

    <script type="module">
      if (new URLSearchParams(location.search).get("admin") === "1") {
        document.documentElement.classList.add("admin");
      }

      const state = {
        data: null,
        audio: new Audio(),
        stopTimer: 0,
        segmentMap: new Map(),
        itemMap: new Map(),
        segmentSeq: 0,
        samples: [],
        selectedSample: null,
        editing: null,
        textAiOpenId: "",
        textAiDraft: "",
        textAiAnswer: "",
        textAiStatus: "",
        vocabularyContext: { words: [], occurrences: null, status: "尚未读取" },
        expandedTextSections: { basic: true, application: false },
        textDisplayModes: { basic: "both", application: "both" }
      };

      const textDisplayModeLabels = { both: "中日", zh: "中文", ja: "日语" };
      const textDisplayModeOrder = ["both", "zh", "ja"];
      const VOCABULARY_COLLAPSED_STORAGE_KEY = "japaflow.tools.textPreview.vocabularyCollapsed.v1";

      const $ = (selector) => document.querySelector(selector);
      const escapeHtml = (value) => String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");

      const assetSrc = (path) => {
        if (!path) return "";
        if (/^(?:https?:)?\/\//.test(path) || path.startsWith("/")) return path;
        return `../${path}`;
      };

      function normalizePayload(payload) {
        if (!payload || (!payload.basicText && !payload.applicationText)) {
          throw new Error("JSON 中缺少 basicText 或 applicationText。");
        }
        return payload;
      }

      function setStatus(message, isError = false) {
        $("#status").textContent = message || "";
        $("#status").classList.toggle("error", Boolean(isError));
      }

      function setData(payload, sourceLabel = "导入数据") {
        state.data = normalizePayload(payload);
        state.expandedTextSections = { basic: true, application: false };
        state.textDisplayModes = { basic: "both", application: "both" };
        resetTextAiPanel();
        $("#jsonInput").value = JSON.stringify(state.data, null, 2);
        setStatus(`${sourceLabel} 已加载。`);
        render();
      }

      function lessonNoFromLocation() {
        const params = new URLSearchParams(location.search);
        const raw = params.get("lesson") || params.get("lessonId") || params.get("lessonNo") || "";
        const queryMatch = String(raw).match(/\d+/);
        if (queryMatch) return Number(queryMatch[0]);
        const hashMatch = location.hash.match(/lesson=(\d+)/);
        return hashMatch ? Number(hashMatch[1]) : 0;
      }

      async function initSamples() {
        const requestedLessonNo = lessonNoFromLocation();
        await refreshSamples(requestedLessonNo || null);
        const initialSample = requestedLessonNo
          ? state.samples.find((sample) => sample.lessonNo === requestedLessonNo)
          : state.samples[0];
        if (initialSample) {
          await selectSample(initialSample.lessonNo);
        } else {
          setStatus(requestedLessonNo ? `data/ocr 下暂无第 ${requestedLessonNo} 课课文样例数据。` : "data/ocr 下暂无课文样例数据。", true);
          renderLessonList();
        }
      }

      async function refreshSamples(preferredLessonNo = null) {
        const response = await fetch("/api/ocr/sample-lessons?type=text", { cache: "no-store" });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || `读取样例列表失败：${response.status}`);
        state.samples = result.lessons || [];
        if (preferredLessonNo) {
          state.selectedSample = state.samples.find((sample) => sample.lessonNo === preferredLessonNo) || state.selectedSample;
        }
        renderLessonList();
      }

      async function selectSample(lessonNo) {
        const sample = state.samples.find((item) => item.lessonNo === lessonNo);
        if (!sample) return;
        state.selectedSample = sample;
        renderLessonList();
        const response = await fetch(sample.url, { cache: "no-store" });
        if (!response.ok) throw new Error(`读取 ${sample.label} JSON 失败：${response.status}`);
        await loadVocabularyContext(lessonNo);
        setData(await response.json(), `${sample.label}${sample.hasAudio ? "音频标注样例" : "样例"}`);
      }

      async function loadVocabularyContext(lessonNo) {
        const [vocabularyResponse, occurrenceResponse] = await Promise.all([
          fetch(`/data/ocr/lesson${lessonNo}-vocabulary-audio-verified.json`, { cache: "no-store" }),
          fetch(`/data/ocr/lesson${lessonNo}-vocabulary-occurrences.json`, { cache: "no-store" })
        ]);
        const vocabularyData = vocabularyResponse.ok ? await vocabularyResponse.json() : null;
        const occurrenceData = occurrenceResponse.ok ? await occurrenceResponse.json() : null;
        state.vocabularyContext = {
          words: vocabularyData?.vocabulary || [],
          occurrences: occurrenceData,
          status: vocabularyResponse.ok && occurrenceResponse.ok
            ? "OCR 单词表与出现索引已读取"
            : `读取失败：词表 ${vocabularyResponse.status}，索引 ${occurrenceResponse.status}`
        };
      }

      async function loadDefault() {
        if (!state.selectedSample && state.samples.length) state.selectedSample = state.samples[0];
        if (!state.selectedSample) {
          await initSamples();
          return;
        }
        await selectSample(state.selectedSample.lessonNo);
      }

      function renderLessonList() {
        $("#lessonList").innerHTML = state.samples.length ? state.samples.map((sample) => {
          const totalLines = (sample.counts?.basicSentences || 0) + (sample.counts?.basicDialogueLines || 0) + (sample.counts?.applicationDialogueLines || 0);
          return `
            <button class="lesson-chip ${sample.lessonNo === state.selectedSample?.lessonNo ? "active" : ""}" type="button" data-lesson-no="${sample.lessonNo}">
              <span>${escapeHtml(sample.label)}</span>
              <span class="count">${escapeHtml(totalLines)}</span>
              ${sample.hasAudio ? "<span aria-label=\"有音频区间标注\">▶</span>" : ""}
            </button>
          `;
        }).join("") : `<span class="status">暂无样例</span>`;
        $("#lessonList").querySelectorAll("button[data-lesson-no]").forEach((button) => {
          button.addEventListener("click", () => {
            selectSample(Number(button.dataset.lessonNo)).catch((error) => setStatus(error.message, true));
          });
        });
      }

      async function generateAudioAlignment() {
        const lessonNo = state.selectedSample?.lessonNo || lessonNoFromData() || 1;
        setStatus("正在生成音频区间标注...");
        $("#generateAudio").disabled = true;
        try {
          const response = await fetch("/api/ocr/audio-align", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ lessonId: lessonNo, target: "text", force: true })
          });
          const result = await response.json();
          if (!response.ok) throw new Error(result.error || `生成失败：${response.status}`);
          await refreshSamples(lessonNo);
          await selectSample(lessonNo);
          const textOutput = (result.outputs || []).find((item) => item.outputPath?.includes("-text-audio-verified.json"));
          const mapped = (textOutput?.tracks || []).reduce((sum, item) => sum + (item.items || 0), 0);
          setStatus(mapped ? `音频区间标注已生成：${mapped} 条。` : "音频区间标注已生成。");
        } catch (error) {
          setStatus(error.message, true);
        } finally {
          $("#generateAudio").disabled = false;
        }
      }

      function render() {
        const data = state.data;
        const sentenceCount = (data?.basicText?.basicSentences || []).length;
        const basicDialogueLines = (data?.basicText?.dialogues || []).reduce((sum, dialogue) => sum + (dialogue.lines || []).length, 0);
        const appLines = (data?.applicationText?.blocks || []).reduce((sum, block) => sum + (block.lines || []).length, 0);
        state.segmentMap = new Map();
        state.itemMap = new Map();
        state.segmentSeq = 0;
        const audioSegments = collectAudioSegments(data);
        const pendingCount = audioSegments.filter((segment) => segment.review?.status !== "approved").length;
        $("#summary").textContent = data ? `${data.lessonId || "unknown"} · 基本句 ${sentenceCount} · 对话 ${basicDialogueLines + appLines} 行${audioSegments.length ? ` · 已通过 ${audioSegments.length - pendingCount} · 待核对 ${pendingCount}` : ""}` : "未加载";
        $("#textPreview").innerHTML = data ? `${renderBasic(data.basicText)}${renderApplication(data.applicationText)}` : "";
        bindSegmentButtons();
        renderImages(data);
      }

      function lessonNoFromData() {
        const match = String(state.data?.lessonId || "").match(/\d+/);
        return match ? Number(match[0]) : 0;
      }

      function renderBasic(basicText) {
        if (!basicText) return "";
        const mode = state.textDisplayModes.basic || "both";
        const sentences = (basicText.basicSentences || []).map((sentence) => {
          const segmentId = registerSegment(sentence.audioSegment);
          registerItem(sentence);
          return `
            <div class="sentence${segmentId ? " has-audio" : ""}${state.textAiOpenId === sentence.id ? " ai-open" : ""}" data-item-id="${escapeHtml(sentence.id || "")}" ${segmentId ? `data-play-segment-id="${escapeHtml(segmentId)}"` : ""}>
              <div class="num">${escapeHtml(sentence.order || "")}</div>
              <div class="text-cell">${renderTextContent(sentence, mode)}${renderTextAiPanel(sentence)}</div>
              <div>${segmentActions(sentence, segmentId, sentence.audioSegment)}</div>
            </div>
          `;
        }).join("");

        const dialogues = (basicText.dialogues || []).map((dialogue) => `
          <div class="dialogue">
            <h3 class="dialogue-title">对话 ${escapeHtml(dialogue.label || "")}</h3>
            ${(dialogue.lines || []).map((line) => renderLine(line, mode)).join("")}
          </div>
        `).join("");

        const expanded = Boolean(state.expandedTextSections.basic);
        return `
          <section class="text-section ${expanded ? "expanded" : "collapsed"}" data-text-section="basic">
            <div class="section-head">
              <h3>${escapeHtml(basicText.title || "基本课文")}</h3>
              <span class="section-actions">
                <button class="section-display-toggle" type="button" data-display-section="basic">${textDisplayModeLabels[mode]}</button>
                <button class="section-toggle" type="button" data-toggle-section="basic" aria-expanded="${expanded ? "true" : "false"}">${expanded ? "▾ 收起" : "▸ 展开"}</button>
              </span>
            </div>
            ${renderTextVocabularyList("basic")}
            ${expanded ? `<div class="basic-sentences">${sentences}</div>${dialogues}` : ""}
          </section>
        `;
      }

      function renderApplication(applicationText) {
        if (!applicationText) return "";
        const mode = state.textDisplayModes.application || "both";
        const displayedDescriptions = new Set();
        const sceneGroups = [];
        let currentSceneGroup = [];
        const flushSceneGroup = () => {
          if (currentSceneGroup.length) sceneGroups.push(currentSceneGroup.join(""));
          currentSceneGroup = [];
        };
        (applicationText.blocks || []).forEach((block) => {
          if (block.type === "dialogue") {
            currentSceneGroup.push(`<div class="dialogue">${(block.lines || []).map((line) => renderLine(line, mode)).join("")}</div>`);
            return;
          }
          flushSceneGroup();
          if (mode === "ja") return;
          const description = String(block.text || block.rawText || "")
            .trim()
            .replace(/^[（(]\s*|\s*[）)]$/g, "");
          const descriptionKey = description.replace(/\s+/g, "");
          if (!description || displayedDescriptions.has(descriptionKey)) return;
          displayedDescriptions.add(descriptionKey);
          currentSceneGroup.push(`
            <div class="block ${escapeHtml(block.type || "narration")}">
              <div class="cn">${escapeHtml(description)}</div>
            </div>
          `);
        });
        flushSceneGroup();
        const blocks = sceneGroups.map((group) => `<div class="application-scene-group">${group}</div>`).join("");

        const expanded = Boolean(state.expandedTextSections.application);
        return `
          <section class="text-section ${expanded ? "expanded" : "collapsed"}" data-text-section="application">
            <div class="section-head">
              <h3>${escapeHtml(applicationText.title || "应用课文")}</h3>
              <span class="section-actions">
                <span class="section-label">旁白 / 场景 / 多人对话</span>
                <button class="section-display-toggle" type="button" data-display-section="application">${textDisplayModeLabels[mode]}</button>
                <button class="section-toggle" type="button" data-toggle-section="application" aria-expanded="${expanded ? "true" : "false"}">${expanded ? "▾ 收起" : "▸ 展开"}</button>
              </span>
            </div>
            ${renderTextVocabularyList("application")}
            ${expanded ? blocks : ""}
          </section>
        `;
      }

      function renderLine(line, mode = "both") {
        const segmentId = registerSegment(line.audioSegment);
        registerItem(line);
        return `
          <div class="line${segmentId ? " has-audio" : ""}${state.textAiOpenId === line.id ? " ai-open" : ""}" data-item-id="${escapeHtml(line.id || "")}" ${segmentId ? `data-play-segment-id="${escapeHtml(segmentId)}"` : ""}>
            <div><span class="speaker">${escapeHtml(line.speaker || "?")}</span></div>
            <div class="text-cell">${renderTextContent(line, mode)}${renderTextAiPanel(line)}</div>
            <div>${segmentActions(line, segmentId, line.audioSegment)}</div>
          </div>
        `;
      }

      function renderTextVocabularyList(section) {
        const context = state.vocabularyContext;
        const indexes = context.occurrences?.text?.[section];
        const words = Array.isArray(indexes)
          ? indexes.map((index) => ({ index, word: context.words[index - 1] })).filter((item) => item.word)
          : [];
        if (!words.length) return "";
        const chips = words.map(({ index, word }) => {
          const writing = word.writing || word.kana || "";
          const japanese = word.kana && hasKanji(writing)
            ? `<ruby>${escapeHtml(writing)}<rt>${escapeHtml(word.kana)}</rt></ruby>`
            : escapeHtml(writing);
          return `
          <button class="text-vocabulary-chip" type="button" data-vocabulary-index="${index}" title="播放单词发音">
            <span>${japanese}</span>
            <span class="text-vocabulary-meaning">${escapeHtml((word.meaningZh || []).join("；"))}</span>
            ${word.partOfSpeech ? `<span class="text-vocabulary-pos">${escapeHtml(word.partOfSpeech)}</span>` : ""}
          </button>
        `;
        }).join("");
        const collapsed = window.localStorage.getItem(VOCABULARY_COLLAPSED_STORAGE_KEY) !== "false";
        return `<div class="text-vocabulary-debug" data-text-vocabulary-section="${section}">
          <button class="text-vocabulary-toggle" type="button" data-toggle-vocabulary="${section}" aria-expanded="${!collapsed}">
            <strong>本段生词 · ${words.length}</strong><span>${collapsed ? "▸" : "▾"}</span>
          </button>
          ${collapsed ? "" : `<div class="text-vocabulary-items">${chips}</div>`}
        </div>`;
      }

      function segmentActions(item, segmentId, segment) {
        return `
          <div class="segment-actions">
            ${segmentButton(segmentId, segment)}
            ${item?.id ? `<button class="audio-button text-ai-button ${state.textAiOpenId === item.id ? "active" : ""}" type="button" data-text-ai-toggle="${escapeHtml(item.id)}" title="问 AI" aria-label="问 AI">AI</button>` : ""}
            ${segmentReviewStatus(segment)}
            ${item?.id && segment ? `<button class="audio-button segment-settings" type="button" data-edit-item-id="${escapeHtml(item.id)}" title="设置音频区间" aria-label="设置音频区间">⚙</button>` : ""}
          </div>
        `;
      }

      function renderTextAiPanel(item) {
        if (!item?.id || state.textAiOpenId !== item.id) return "";
        const notes = readTextAiNotes(item.id);
        return `
          <div class="text-ai-panel" data-text-ai-panel="${escapeHtml(item.id)}">
            <textarea data-text-ai-draft="${escapeHtml(item.id)}" rows="1" placeholder="写下笔记，或输入想问 AI 的问题...">${escapeHtml(state.textAiDraft || "")}</textarea>
            ${state.textAiAnswer ? `<div class="text-ai-answer" aria-label="AI 回答"><strong>AI 回答</strong><p>${escapeHtml(state.textAiAnswer)}</p></div>` : ""}
            ${state.textAiStatus ? `<small>${escapeHtml(state.textAiStatus)}</small>` : ""}
            <div class="text-ai-actions">
              <button type="button" data-text-ai-save="${escapeHtml(item.id)}" ${(state.textAiDraft || "").trim() ? "" : "disabled"}>保存笔记</button>
              <button type="button" data-text-ai-ask="${escapeHtml(item.id)}" ${(state.textAiDraft || "").trim() ? "" : "disabled"}>问 AI</button>
            </div>
            ${notes.length ? `
              <div class="text-ai-saved-list">
                ${notes.map((note) => `
                  <article class="text-ai-saved">
                    <button type="button" data-text-ai-erase="${escapeHtml(item.id)}" data-note-id="${escapeHtml(note.id)}" aria-label="删除笔记" title="删除笔记">⌫</button>
                    <pre>${escapeHtml(note.text)}</pre>
                  </article>
                `).join("")}
              </div>
            ` : ""}
          </div>
        `;
      }

      function resetTextAiPanel() {
        state.textAiOpenId = "";
        state.textAiDraft = "";
        state.textAiAnswer = "";
        state.textAiStatus = "";
      }

      function textAiStorageKey(itemId) {
        const lessonId = state.data?.lessonId || state.selectedSample?.lessonNo || "unknown";
        return `japaflow.tools.textPreview.aiNotes.v1:${lessonId}:${itemId}`;
      }

      function readTextAiNotes(itemId) {
        try {
          const value = JSON.parse(window.localStorage.getItem(textAiStorageKey(itemId)) || "[]");
          return Array.isArray(value) ? value : [];
        } catch {
          return [];
        }
      }

      function writeTextAiNotes(itemId, notes) {
        window.localStorage.setItem(textAiStorageKey(itemId), JSON.stringify(notes));
      }

      function saveTextAiNote(itemId) {
        const draft = String(state.textAiDraft || "").trim();
        if (!draft) return;
        const answer = String(state.textAiAnswer || "").trim();
        const notes = readTextAiNotes(itemId);
        writeTextAiNotes(itemId, [...notes, { id: `${Date.now()}-${Math.random().toString(16).slice(2)}`, text: answer ? `问：${draft}\n答：${answer}` : draft }]);
        resetTextAiPanel();
        render();
      }

      function eraseTextAiNote(itemId, noteId) {
        writeTextAiNotes(itemId, readTextAiNotes(itemId).filter((note) => note.id !== noteId));
        render();
      }

      async function askTextAi(itemId) {
        const item = state.itemMap.get(itemId);
        const draft = String(state.textAiDraft || "").trim();
        if (!item || !draft) return;
        state.textAiStatus = "思考中...";
        state.textAiAnswer = "";
        render();
        try {
          const response = await fetch("/api/grammar/notebook-ai", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Authorization: `Bearer ${window.localStorage.getItem("light_blog_token") || ""}`
            },
            body: JSON.stringify({
              question: `${copyTextForJapanese(item)}\n\n${draft}`,
              lessonId: state.data?.lessonId || state.selectedSample?.lessonNo || "",
              pageNo: itemId
            })
          });
          const data = await response.json().catch(() => ({}));
          if (!response.ok) throw new Error(data.error || data.message || "AI 请求失败。");
          const answer = String([data?.answer, data?.data?.answer, data?.content, data?.data?.content].find((value) => typeof value === "string" && value.trim()) || "").trim();
          state.textAiAnswer = answer;
          state.textAiStatus = answer ? "回答已生成。" : "AI 未返回可保存的回答，请重试。";
        } catch (error) {
          state.textAiStatus = error.message || "AI 请求失败。";
        }
        render();
      }

      function segmentReviewStatus(segment) {
        if (!segment) return "";
        const pending = segment.review?.status !== "approved";
        const score = Number(segment.matchScore);
        const status = pending ? "待核对" : "已通过";
        const source = segment.timingSource === "azure-speech-word-timestamp-with-boundary-padding" ? "Azure 句界" : "旧标注";
        const diagnostics = [
          source,
          Number.isFinite(score) ? `匹配 ${(score * 100).toFixed(0)}%` : "",
          ...(segment.alignmentIssues || []),
          segment.review?.note || ""
        ].filter(Boolean).join(" · ");
        return `<span class="audio-review-status ${pending ? "pending" : ""}" title="${escapeHtml(diagnostics)}">${status}${Number.isFinite(score) ? ` ${(score * 100).toFixed(0)}%` : ""}</span>`;
      }

      function segmentButton(segmentId, segment) {
        if (!segmentId || !segment) return `<span class="audio-placeholder"></span>`;
        return `<button class="audio-button" type="button" data-segment-id="${escapeHtml(segmentId)}" title="${escapeHtml(formatSegmentTime(segment))}" aria-label="播放音频片段">▶</button>`;
      }

      function registerItem(item) {
        if (item?.id) state.itemMap.set(item.id, item);
      }

      function registerSegment(segment) {
        if (!segment) return "";
        const id = `segment-${state.segmentSeq += 1}`;
        state.segmentMap.set(id, segment);
        return id;
      }

      function collectAudioSegments(data) {
        return [
          ...(data?.basicText?.basicSentences || []),
          ...(data?.basicText?.dialogues || []).flatMap((dialogue) => dialogue.lines || []),
          ...(data?.applicationText?.blocks || []).flatMap((block) => block.lines || [])
        ].map((item) => item.audioSegment).filter(Boolean);
      }

      function renderJapanese(item) {
        const segments = Array.isArray(item?.segments) ? item.segments : [];
        if (!segments.length) return `<span class="base-text">${escapeHtml(item?.text || "")}</span>`;
        return segments.map((segment) => {
          const text = segment?.text || "";
          const ruby = segment?.ruby || "";
          if (!ruby) return `<span class="base-text">${escapeHtml(text)}</span>`;
          return rubyTextSegments(text, ruby).map((part) => {
            if (!part.ruby) return `<span class="base-text">${escapeHtml(part.text)}</span>`;
            return `<ruby><rb>${escapeHtml(part.text)}</rb><rt aria-hidden="true">${escapeHtml(part.ruby)}</rt></ruby>`;
          }).join("");
        }).join("");
      }

      function hasKanji(value) {
        return /[\u3400-\u9fff々〆ヵヶ]/.test(value);
      }

      function isKanjiChar(char) {
        return /[\u3400-\u9fff々〆ヵヶ]/.test(char);
      }

      function toHiragana(value) {
        return String(value || "").replace(/[\u30a1-\u30f6]/g, (char) =>
          String.fromCharCode(char.charCodeAt(0) - 0x60)
        );
      }

      function rubyTextSegments(text, ruby) {
        if (!text || !ruby || !hasKanji(text)) return [{ text }];

        const tokens = [];
        for (const char of [...text]) {
          const kind = isKanjiChar(char) ? "kanji" : "plain";
          const last = tokens[tokens.length - 1];
          if (last?.kind === kind) last.text += char;
          else tokens.push({ kind, text: char });
        }

        if (tokens.every((token) => token.kind === "kanji")) return [{ text, ruby }];

        const parts = [];
        let rubyCursor = 0;
        const normalizedRuby = toHiragana(ruby);

        tokens.forEach((token, index) => {
          if (token.kind === "plain") {
            const reading = toHiragana(token.text);
            if (normalizedRuby.slice(rubyCursor).startsWith(reading)) rubyCursor += reading.length;
            parts.push({ text: token.text });
            return;
          }

          const nextPlain = tokens.slice(index + 1).find((item) => item.kind === "plain");
          let rubyEnd = ruby.length;
          if (nextPlain) {
            const nextReading = toHiragana(nextPlain.text);
            const found = normalizedRuby.indexOf(nextReading, rubyCursor + 1);
            if (found >= 0) rubyEnd = found;
          }

          const tokenRuby = ruby.slice(rubyCursor, rubyEnd);
          rubyCursor = rubyEnd;
          parts.push(tokenRuby ? { text: token.text, ruby: tokenRuby } : { text: token.text });
        });

        return parts;
      }

      function renderTextContent(item, mode = "both") {
        const parts = [];
        if (mode !== "zh") {
          parts.push(`<div class="jp" data-copy-text="${escapeHtml(copyTextForJapanese(item))}">${renderJapanese(item)}</div>`);
        }
        if (mode !== "ja") {
          parts.push(`<div class="cn${mode === "zh" ? " text-only-translation" : ""}">${escapeHtml(item?.translationZh || "")}</div>`);
        }
        return parts.join("");
      }

      function copyTextForJapanese(item) {
        const segments = Array.isArray(item?.segments) ? item.segments : [];
        return segments.length ? segments.map((segment) => segment?.text || "").join("") : item?.text || "";
      }

      function bindSegmentButtons() {
        $("#textPreview").querySelectorAll("[data-toggle-vocabulary]").forEach((button) => {
          button.addEventListener("click", () => {
            const collapsed = button.getAttribute("aria-expanded") === "true";
            window.localStorage.setItem(VOCABULARY_COLLAPSED_STORAGE_KEY, String(collapsed));
            render();
          });
        });
        $("#textPreview").querySelectorAll("[data-vocabulary-index]").forEach((button) => {
          button.addEventListener("click", (event) => {
            event.stopPropagation();
            const index = Number(button.dataset.vocabularyIndex);
            const word = state.vocabularyContext.words[index - 1];
            if (!word?.audioSegment) return;
            button.classList.add("playing");
            playSegment(word.audioSegment).finally(() => {
              const duration = Math.max(300, Number(word.audioSegment.duration || 0) * 1000);
              window.setTimeout(() => button.classList.remove("playing"), duration);
            });
          });
        });
        $("#textPreview").querySelectorAll("[data-toggle-section]").forEach((button) => {
          button.addEventListener("click", () => {
            const section = button.dataset.toggleSection;
            if (!section) return;
            resetTextAiPanel();
            state.expandedTextSections = { ...state.expandedTextSections, [section]: !state.expandedTextSections[section] };
            render();
          });
        });
        $("#textPreview").querySelectorAll("[data-display-section]").forEach((button) => {
          button.addEventListener("click", () => {
            const section = button.dataset.displaySection;
            if (!section) return;
            const current = state.textDisplayModes[section] || "both";
            const next = textDisplayModeOrder[(textDisplayModeOrder.indexOf(current) + 1) % textDisplayModeOrder.length];
            resetTextAiPanel();
            state.textDisplayModes = { ...state.textDisplayModes, [section]: next };
            render();
          });
        });
        $("#textPreview").querySelectorAll("[data-text-ai-toggle]").forEach((button) => {
          button.addEventListener("click", (event) => {
            event.stopPropagation();
            const itemId = button.dataset.textAiToggle;
            const opening = state.textAiOpenId !== itemId;
            state.textAiOpenId = opening ? itemId : "";
            state.textAiDraft = "";
            state.textAiAnswer = "";
            state.textAiStatus = "";
            render();
          });
        });
        $("#textPreview").querySelectorAll("[data-text-ai-draft]").forEach((textarea) => {
          textarea.addEventListener("click", (event) => event.stopPropagation());
          textarea.addEventListener("input", () => {
            state.textAiDraft = textarea.value;
            textarea.style.height = "auto";
            textarea.style.height = `${Math.max(38, textarea.scrollHeight)}px`;
            $("#textPreview").querySelectorAll("[data-text-ai-save], [data-text-ai-ask]").forEach((button) => {
              button.disabled = !state.textAiDraft.trim();
            });
          });
        });
        $("#textPreview").querySelectorAll("[data-text-ai-ask]").forEach((button) => {
          button.addEventListener("click", (event) => {
            event.stopPropagation();
            askTextAi(button.dataset.textAiAsk);
          });
        });
        $("#textPreview").querySelectorAll("[data-text-ai-save]").forEach((button) => {
          button.addEventListener("click", (event) => {
            event.stopPropagation();
            saveTextAiNote(button.dataset.textAiSave);
          });
        });
        $("#textPreview").querySelectorAll("[data-text-ai-erase]").forEach((button) => {
          button.addEventListener("click", (event) => {
            event.stopPropagation();
            eraseTextAiNote(button.dataset.textAiErase, button.dataset.noteId);
          });
        });
        $("#textPreview").querySelectorAll(".sentence[data-play-segment-id], .line[data-play-segment-id]").forEach((row) => {
          row.addEventListener("click", (event) => {
            if (event.target.closest("button, textarea")) return;
            const segmentId = row.dataset.playSegmentId;
            if (!segmentId) return;
            if (state.textAiOpenId) resetTextAiPanel();
            playSegment(state.segmentMap.get(segmentId));
            render();
          });
        });
        $("#textPreview").querySelectorAll("[data-segment-id]").forEach((button) => {
          button.addEventListener("click", (event) => {
            event.stopPropagation();
            playSegment(state.segmentMap.get(button.dataset.segmentId));
          });
        });
        $("#textPreview").querySelectorAll("[data-edit-item-id]").forEach((button) => {
          button.addEventListener("click", (event) => {
            event.stopPropagation();
            openSegmentModal(button.dataset.editItemId).catch((error) => setStatus(error.message, true));
          });
        });
      }

      function bindCopyBehavior() {
        $("#textPreview").addEventListener("copy", (event) => {
          const selection = window.getSelection();
          if (!selection || selection.isCollapsed || selection.rangeCount !== 1) return;
          const range = selection.getRangeAt(0);
          const copied = selectedBaseText(range);
          if (!copied) return;
          event.clipboardData.setData("text/plain", copied);
          event.preventDefault();
        });
      }

      function selectedBaseText(range) {
        const selectedNodes = [...$("#textPreview").querySelectorAll(".jp[data-copy-text]")]
          .filter((node) => range.intersectsNode(node));
        if (!selectedNodes.length) return "";
        return selectedNodes.map((node) => node.dataset.copyText || node.textContent || "").join("\n");
      }

      function formatSegmentTime(segment) {
        return `${Number(segment.start || 0).toFixed(3)}s - ${Number(segment.end || 0).toFixed(3)}s`;
      }

      async function playSegment(segment) {
        if (!segment?.sourceUrl) {
          setStatus("当前句子没有音频片段。", true);
          return;
        }
        clearInterval(state.stopTimer);
        state.audio.pause();
        state.audio.src = segment.sourceUrl;
        try {
          await waitForAudioMetadata();
          state.audio.currentTime = Math.max(0, Number(segment.start) || 0);
          state.stopTimer = window.setInterval(() => {
            if (state.audio.currentTime >= Number(segment.end || 0)) {
              state.audio.pause();
              clearInterval(state.stopTimer);
            }
          }, 30);
          await state.audio.play();
        } catch (error) {
          clearInterval(state.stopTimer);
          setStatus(`播放失败：${error.message}`, true);
        }
      }

      function modalStatus(message, isError = false) {
        $("#segmentModalStatus").textContent = message || "";
        $("#segmentModalStatus").classList.toggle("error", Boolean(isError));
      }

      async function loadEditableSegment(itemId) {
        const item = state.itemMap.get(itemId);
        const lessonNo = state.selectedSample?.lessonNo || lessonNoFromData() || lessonNoFromLocation();
        const editableSegment = item?.audioSegment || null;
        if (!item || !editableSegment) throw new Error("当前句子没有可编辑的音频区间。");
        return { item, lessonNo, segment: editableSegment };
      }

      async function openSegmentModal(itemId) {
        const editing = await loadEditableSegment(itemId);
        state.editing = editing;
        $("#segmentModalText").textContent = editing.item.text || "";
        $("#segmentStart").value = Number(editing.segment.start || 0).toFixed(3);
        $("#segmentEnd").value = Number(editing.segment.end || 0).toFixed(3);
        modalStatus(`当前区间：${formatSegmentTime(editing.segment)}`);
        $("#segmentModal").classList.add("open");
        $("#segmentModal").setAttribute("aria-hidden", "false");
        $("#segmentStart").focus();
      }

      function closeSegmentModal() {
        state.editing = null;
        $("#segmentModal").classList.remove("open");
        $("#segmentModal").setAttribute("aria-hidden", "true");
      }

      function editedRange() {
        const start = Number($("#segmentStart").value);
        const end = Number($("#segmentEnd").value);
        if (!Number.isFinite(start) || !Number.isFinite(end) || start < 0 || end <= start) {
          throw new Error("请填写有效的开始和结束时间。");
        }
        return {
          start: Math.round(start * 1000) / 1000,
          end: Math.round(end * 1000) / 1000
        };
      }

      async function testEditedSegment() {
        if (!state.editing) return;
        try {
          const range = editedRange();
          await playSegment({ ...state.editing.segment, ...range });
          modalStatus(`测试播放：${range.start.toFixed(3)}s - ${range.end.toFixed(3)}s`);
        } catch (error) {
          modalStatus(error.message, true);
        }
      }

      async function saveEditedSegment() {
        if (!state.editing) return;
        try {
          const range = editedRange();
          modalStatus("正在保存...");
          $("#saveSegment").disabled = true;
          const response = await fetch("/api/ocr/text-audio-segment", {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              lessonId: state.editing.lessonNo,
              itemId: state.editing.item.id,
              start: range.start,
              end: range.end
            })
          });
          const result = await response.json();
          if (!response.ok) throw new Error(result.error || `保存失败：${response.status}`);
          state.editing.item.audioSegment = result.audioSegment;
          render();
          closeSegmentModal();
          setStatus(`音频区间已保存：${result.updatedFiles.join("，")}`);
        } catch (error) {
          modalStatus(error.message, true);
        } finally {
          $("#saveSegment").disabled = false;
        }
      }

      function waitForAudioMetadata() {
        if (state.audio.readyState >= 1) return Promise.resolve();
        state.audio.load();
        return new Promise((resolve, reject) => {
          const cleanup = () => {
            state.audio.removeEventListener("loadedmetadata", handleLoaded);
            state.audio.removeEventListener("error", handleError);
          };
          const handleLoaded = () => {
            cleanup();
            resolve();
          };
          const handleError = () => {
            cleanup();
            reject(new Error("音频加载失败"));
          };
          state.audio.addEventListener("loadedmetadata", handleLoaded);
          state.audio.addEventListener("error", handleError);
        });
      }

      function renderImages(data) {
        const images = data?.sourceImages || [];
        $("#imagePanel").innerHTML = images.length ? images.map((image) => {
          const src = assetSrc(image.path);
          return `
            <div class="image-block"><img class="source-image" src="${escapeHtml(src)}" alt="${escapeHtml(image.section || "source")}" /></div>
          `;
        }).join("") : `<p class="status">暂无 sourceImages。</p>`;
      }

      $("#loadDefault").addEventListener("click", () => loadDefault().catch((error) => setStatus(error.message, true)));
      $("#generateAudio").addEventListener("click", generateAudioAlignment);
      $("#parseInput").addEventListener("click", () => {
        try {
          setData(JSON.parse($("#jsonInput").value), "文本框 JSON");
        } catch (error) {
          setStatus(error.message, true);
        }
      });
      $("#fileInput").addEventListener("change", async (event) => {
        const file = event.target.files?.[0];
        if (!file) return;
        try {
          setData(JSON.parse(await file.text()), file.name);
        } catch (error) {
          setStatus(error.message, true);
        }
      });
      $("#closeSegmentModal").addEventListener("click", closeSegmentModal);
      $("#segmentModal").addEventListener("click", (event) => {
        if (event.target.id === "segmentModal") closeSegmentModal();
      });
      $("#testSegmentPlay").addEventListener("click", testEditedSegment);
      $("#saveSegment").addEventListener("click", saveEditedSegment);

      bindCopyBehavior();
      initSamples().catch((error) => setStatus(error.message, true));
    </script>
  </body>
</html>
