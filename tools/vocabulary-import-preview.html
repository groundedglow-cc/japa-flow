<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vocabulary OCR Import Preview</title>
    <script>
      if (new URLSearchParams(location.search).get("embedded") === "1") {
        document.documentElement.classList.add("embedded");
      }
    </script>
    <style>
      :root {
        color-scheme: light;
        --bg: #f6f7f8;
        --panel: #ffffff;
        --line: #d9dee5;
        --text: #17202a;
        --muted: #657181;
        --accent: #1f7a5b;
        --accent-soft: #e7f3ee;
        --warn: #9b5b00;
        --warn-soft: #fff4dc;
        --vocab-left-panel: 48%;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 14px 20px;
        border-bottom: 1px solid var(--line);
        background: var(--panel);
        position: sticky;
        top: 0;
        z-index: 10;
      }

      h1 {
        margin: 0;
        font-size: 18px;
        letter-spacing: 0;
      }

      a {
        color: var(--accent);
        text-decoration: none;
      }

      button,
      input::file-selector-button {
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--panel);
        color: var(--text);
        cursor: pointer;
        font: inherit;
        padding: 8px 12px;
      }

      button.primary {
        border-color: var(--accent);
        background: var(--accent);
        color: #fff;
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.5;
      }

      .workspace {
        display: grid;
        grid-template-columns: minmax(360px, var(--vocab-left-panel)) 8px minmax(320px, 1fr);
        gap: 12px;
        padding: 16px;
        align-items: start;
      }

      .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
      }

      .data-panel {
        padding: 16px;
      }

      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
        margin-bottom: 14px;
      }

      .summary {
        color: var(--muted);
        font-size: 13px;
        margin-left: auto;
      }

      .lesson-row {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 0 0 14px;
      }

      .lesson-title {
        color: var(--muted);
        font-size: 13px;
        white-space: nowrap;
      }

      .lesson-list {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .lesson-chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        min-height: 32px;
        padding: 5px 10px;
        border-radius: 999px;
        font-size: 13px;
      }

      .lesson-chip.active {
        border-color: var(--accent);
        background: var(--accent-soft);
        color: var(--accent);
      }

      .lesson-chip .count {
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }

      details {
        border: 1px solid var(--line);
        border-radius: 8px;
        margin-bottom: 16px;
        overflow: hidden;
      }

      summary {
        cursor: pointer;
        padding: 10px 12px;
        color: var(--muted);
      }

      textarea {
        display: block;
        width: 100%;
        min-height: 180px;
        border: 0;
        border-top: 1px solid var(--line);
        resize: vertical;
        padding: 12px;
        font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }

      .status {
        min-height: 20px;
        color: var(--muted);
        font-size: 13px;
        margin-bottom: 12px;
      }

      .status.error {
        color: #b42318;
      }

      .word-card {
        border: 1px solid var(--line);
        border-radius: 8px;
        overflow: hidden;
      }

      .word-nav {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        border-bottom: 1px solid var(--line);
        padding: 10px;
        background: #fbfcfd;
      }

      .word-nav-side {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
      }

      .word-nav-side.right {
        justify-content: flex-end;
      }

      .word-shortcut {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        color: var(--muted);
        font-size: 12px;
        white-space: nowrap;
      }

      .word-shortcut-key {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 18px;
        height: 18px;
        padding: 0 5px;
        border: 1px solid var(--line);
        border-bottom-width: 2px;
        border-radius: 4px;
        background: #fff;
        color: var(--text);
        font-size: 11px;
        line-height: 1;
      }

      .word-index {
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }

      .word-body {
        padding: 18px;
      }

      .word-main {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 18px;
      }

      .jp {
        display: flex;
        align-items: baseline;
        flex-wrap: wrap;
        gap: 12px;
        min-width: 0;
      }

      .writing {
        font-size: 36px;
        font-weight: 700;
        letter-spacing: 0;
        line-height: 1.25;
      }

      .writing ruby {
        ruby-position: over;
        ruby-align: center;
      }

      .writing rt {
        color: var(--muted);
        font-size: 0.36em;
        font-weight: 500;
        line-height: 1;
        user-select: none;
      }

      .meaning-inline {
        color: var(--muted);
        font-size: 18px;
        font-weight: 500;
        line-height: 1.4;
      }

      .meta {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        justify-content: flex-end;
        margin: 8px 0 0;
        flex: 0 0 auto;
      }

      .tag {
        display: inline-flex;
        align-items: center;
        min-height: 24px;
        padding: 2px 8px;
        border-radius: 999px;
        background: var(--accent-soft);
        color: var(--accent);
        font-size: 12px;
      }

      .tag.warn {
        background: var(--warn-soft);
        color: var(--warn);
      }

      .tag.danger {
        background: #fee4e2;
        color: #b42318;
      }

      .tag.neutral {
        background: #eef2f6;
        color: #465466;
      }

      .raw {
        color: var(--muted);
        font-size: 13px;
        line-height: 1.5;
      }

      .audio-row {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 10px;
        margin: 12px 0 4px;
        color: var(--muted);
        font-size: 13px;
      }

      .audio-review {
        display: grid;
        gap: 6px;
        margin: 10px 0 0;
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fbfcfd;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.5;
      }

      .audio-review.warn {
        border-color: #f6c76c;
        background: var(--warn-soft);
        color: var(--warn);
      }

      .audio-review.danger {
        border-color: #fda29b;
        background: #fff0ee;
        color: #b42318;
      }

      .audio-review-line {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 12px;
      }

      .audio-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 34px;
        height: 34px;
        padding: 0;
        border-color: var(--accent);
        color: var(--accent);
        background: var(--accent-soft);
        font-size: 18px;
        line-height: 1;
      }

      .segment-settings {
        display: inline-flex;
        font-size: 18px;
      }

      .panel-resizer {
        position: sticky;
        top: 72px;
        width: 8px;
        min-height: calc(100vh - 104px);
        border: 0;
        border-radius: 999px;
        background: linear-gradient(to right, transparent 0 2px, var(--line) 2px 6px, transparent 6px 8px);
        cursor: col-resize;
      }

      .panel-resizer:hover,
      .panel-resizer.dragging {
        background: linear-gradient(to right, transparent 0 2px, var(--accent) 2px 6px, transparent 6px 8px);
      }

      .modal-backdrop {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: none;
        place-items: center;
        padding: 20px;
        background: rgba(23, 32, 42, 0.38);
      }

      .modal-backdrop.open {
        display: grid;
      }

      .modal {
        width: min(100%, 460px);
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        box-shadow: 0 18px 56px rgba(23, 32, 42, 0.22);
      }

      .modal-head,
      .modal-actions {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 12px 14px;
        border-bottom: 1px solid var(--line);
      }

      .modal-actions {
        justify-content: flex-end;
        border-top: 1px solid var(--line);
        border-bottom: 0;
      }

      .modal-body {
        padding: 14px;
      }

      .modal-title {
        font-size: 15px;
        font-weight: 700;
      }

      .modal-text {
        margin: 0 0 12px;
        color: var(--muted);
        line-height: 1.5;
      }

      .time-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-bottom: 10px;
      }

      .time-grid label {
        display: grid;
        gap: 5px;
        color: var(--muted);
        font-size: 12px;
      }

      .time-grid input {
        width: 100%;
        height: 36px;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 0 9px;
        color: var(--text);
        font: inherit;
        font-variant-numeric: tabular-nums;
      }

      .modal-status {
        min-height: 20px;
        color: var(--muted);
        font-size: 13px;
      }

      .modal-status.error {
        color: #b42318;
      }

      .word-list {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(96px, 1fr));
        gap: 8px;
        margin-top: 14px;
      }

      .word-list button {
        min-height: 42px;
        display: flex;
        align-items: center;
        text-align: left;
        padding: 7px 9px;
      }

      .word-list button.review-pending {
        border-color: #f6c76c;
        background: var(--warn-soft);
      }

      .word-list button.review-risk {
        border-color: #fda29b;
        background: #fff0ee;
      }

      .word-list-main {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        width: 100%;
        min-width: 0;
      }

      .review-dot {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        flex: 0 0 auto;
        min-width: 20px;
        height: 20px;
        border-radius: 999px;
        padding: 0 6px;
        font-size: 11px;
        font-weight: 700;
        background: #eef2f6;
        color: #465466;
      }

      .review-dot.pending {
        background: var(--warn-soft);
        color: var(--warn);
      }

      .review-dot.risk {
        background: #fee4e2;
        color: #b42318;
      }

      .word-list strong {
        display: block;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .word-list button.active {
        border-color: var(--accent);
        background: var(--accent-soft);
      }

      .image-panel {
        position: sticky;
        top: 72px;
        padding: 12px;
      }

      .image-title {
        display: flex;
        justify-content: space-between;
        color: var(--muted);
        font-size: 13px;
        margin: 0 0 10px;
      }

      .source-image {
        display: block;
        width: 100%;
        height: auto;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #fff;
      }

      html.embedded header,
      html.embedded .data-panel > .toolbar,
      html.embedded .data-panel > .lesson-row,
      html.embedded .data-panel > details {
        display: none;
      }

      html.embedded .status {
        display: none;
      }

      html.embedded .workspace {
        padding: 0;
      }

      html.embedded .panel {
        border-radius: 0;
      }

      html.embedded .data-panel {
        border-left: 0;
        border-top: 0;
        border-bottom: 0;
      }

      html.embedded .image-panel {
        top: 0;
        border-top: 0;
        border-right: 0;
        border-bottom: 0;
      }

      @media (max-width: 920px) {
        .workspace {
          grid-template-columns: 1fr;
        }

        .panel-resizer {
          display: none;
        }

        .image-panel {
          position: static;
        }

        .word-main {
          display: block;
        }

        .meta {
          justify-content: flex-start;
        }

        .word-nav {
          flex-wrap: wrap;
        }

        .word-nav-side {
          flex: 1 1 auto;
        }

        .word-nav-side.right {
          justify-content: space-between;
          flex-direction: row-reverse;
        }

        .word-shortcut {
          font-size: 11px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>单词 OCR 导入校对</h1>
      <nav><a href="./text-import-preview.html">课文导入校对</a></nav>
    </header>

    <main class="workspace">
      <section class="panel data-panel">
        <div class="toolbar">
          <button class="primary" id="loadDefault" type="button">重新加载当前课次</button>
          <button id="generateAudio" type="button">生成音频区间标注</button>
          <input id="fileInput" type="file" accept="application/json,.json" />
          <span class="summary" id="summary">未加载</span>
        </div>

        <div class="lesson-row">
          <span class="lesson-title">样例课次</span>
          <div class="lesson-list" id="lessonList"></div>
        </div>

        <details>
          <summary>手动粘贴 JSON 导入</summary>
          <textarea id="jsonInput" spellcheck="false" placeholder="粘贴 vocabulary OCR JSON"></textarea>
          <div class="toolbar" style="padding: 10px 12px;">
            <button id="parseInput" type="button">解析文本框</button>
          </div>
        </details>

        <div class="status" id="status"></div>
        <div id="wordCard"></div>
        <div class="word-list" id="wordList"></div>
      </section>

      <button class="panel-resizer" id="panelResizer" type="button" aria-label="调整左右面板宽度"></button>

      <aside class="panel image-panel">
        <p class="image-title">
          <span id="imageLabel">教材图片</span>
          <a id="imageLink" href="#" target="_blank" rel="noreferrer">打开图片</a>
        </p>
        <img class="source-image" id="sourceImage" alt="教材词汇页" />
      </aside>
    </main>

    <div class="modal-backdrop" id="segmentModal" aria-hidden="true">
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="segmentModalTitle">
        <div class="modal-head">
          <div class="modal-title" id="segmentModalTitle">设置音频区间</div>
          <button id="closeSegmentModal" type="button" aria-label="关闭">×</button>
        </div>
        <div class="modal-body">
          <p class="modal-text" id="segmentModalText"></p>
          <div class="time-grid">
            <label>开始时间（秒）<input id="segmentStart" type="number" min="0" step="0.001" /></label>
            <label>结束时间（秒）<input id="segmentEnd" type="number" min="0" step="0.001" /></label>
          </div>
          <div class="modal-status" id="segmentModalStatus"></div>
        </div>
        <div class="modal-actions">
          <button id="testSegmentPlay" type="button">测试播放</button>
          <button class="primary" id="saveSegment" type="button">保存</button>
        </div>
      </div>
    </div>

    <script type="module">
      if (new URLSearchParams(location.search).get("admin") === "1") {
        document.documentElement.classList.add("admin");
      }

      const PANEL_RATIO_STORAGE_KEY = "japaflow.tools.vocabularyPreview.panelRatio.v1";
      const state = { data: null, index: 0, audio: new Audio(), stopTimer: 0, samples: [], selectedSample: null, autoPlayToken: 0, editing: null };

      const $ = (selector) => document.querySelector(selector);
      const escapeHtml = (value) => String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");

      const assetSrc = (path) => {
        if (!path) return "";
        if (/^(?:https?:)?\/\//.test(path) || path.startsWith("/")) return path;
        return `../${path}`;
      };

      function clamp(value, min, max) {
        return Math.max(min, Math.min(max, value));
      }

      function setPanelRatio(percent, persist = true) {
        const ratio = clamp(Number(percent) || 48, 32, 68);
        document.documentElement.style.setProperty("--vocab-left-panel", `${ratio.toFixed(2)}%`);
        if (persist) localStorage.setItem(PANEL_RATIO_STORAGE_KEY, String(ratio));
      }

      function initPanelResizer() {
        const saved = Number(localStorage.getItem(PANEL_RATIO_STORAGE_KEY));
        if (Number.isFinite(saved)) setPanelRatio(saved, false);

        const resizer = $("#panelResizer");
        const workspace = $(".workspace");
        if (!resizer || !workspace) return;

        const updateFromClientX = (clientX) => {
          const rect = workspace.getBoundingClientRect();
          if (!rect.width) return;
          const ratio = ((clientX - rect.left) / rect.width) * 100;
          setPanelRatio(ratio);
        };

        resizer.addEventListener("pointerdown", (event) => {
          if (window.matchMedia("(max-width: 920px)").matches) return;
          event.preventDefault();
          resizer.classList.add("dragging");
          resizer.setPointerCapture(event.pointerId);
          updateFromClientX(event.clientX);
        });

        resizer.addEventListener("pointermove", (event) => {
          if (!resizer.classList.contains("dragging")) return;
          updateFromClientX(event.clientX);
        });

        const stopDragging = (event) => {
          if (!resizer.classList.contains("dragging")) return;
          resizer.classList.remove("dragging");
          if (resizer.hasPointerCapture(event.pointerId)) resizer.releasePointerCapture(event.pointerId);
        };
        resizer.addEventListener("pointerup", stopDragging);
        resizer.addEventListener("pointercancel", stopDragging);
      }

      function normalizePayload(payload) {
        if (!payload || !Array.isArray(payload.vocabulary)) {
          throw new Error("JSON 中缺少 vocabulary 数组。");
        }
        return payload;
      }

      function setStatus(message, isError = false) {
        $("#status").textContent = message || "";
        $("#status").classList.toggle("error", Boolean(isError));
      }

      function setData(payload, sourceLabel = "导入数据") {
        state.data = normalizePayload(payload);
        state.index = 0;
        $("#jsonInput").value = JSON.stringify(state.data, null, 2);
        setStatus(`${sourceLabel} 已加载。`);
        render();
      }

      function lessonNoFromLocation() {
        const params = new URLSearchParams(location.search);
        const raw = params.get("lesson") || params.get("lessonId") || params.get("lessonNo") || "";
        const queryMatch = String(raw).match(/\d+/);
        if (queryMatch) return Number(queryMatch[0]);
        const hashMatch = location.hash.match(/lesson=(\d+)/);
        return hashMatch ? Number(hashMatch[1]) : 0;
      }

      async function initSamples() {
        const requestedLessonNo = lessonNoFromLocation();
        await refreshSamples(requestedLessonNo || null);
        const initialSample = requestedLessonNo
          ? state.samples.find((sample) => sample.lessonNo === requestedLessonNo)
          : state.samples[0];
        if (initialSample) {
          await selectSample(initialSample.lessonNo);
        } else {
          setStatus(requestedLessonNo ? `data/ocr 下暂无第 ${requestedLessonNo} 课单词样例数据。` : "data/ocr 下暂无单词样例数据。", true);
          renderLessonList();
        }
      }

      async function refreshSamples(preferredLessonNo = null) {
        const response = await fetch("/api/ocr/sample-lessons?type=vocabulary", { cache: "no-store" });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || `读取样例列表失败：${response.status}`);
        state.samples = result.lessons || [];
        if (preferredLessonNo) {
          state.selectedSample = state.samples.find((sample) => sample.lessonNo === preferredLessonNo) || state.selectedSample;
        }
        renderLessonList();
      }

      async function selectSample(lessonNo) {
        const sample = state.samples.find((item) => item.lessonNo === lessonNo);
        if (!sample) return;
        state.selectedSample = sample;
        renderLessonList();
        const response = await fetch(sample.url, { cache: "no-store" });
        if (!response.ok) throw new Error(`读取 ${sample.label} JSON 失败：${response.status}`);
        setData(await response.json(), `${sample.label}${sample.hasAudio ? "音频标注样例" : "样例"}`);
      }

      async function loadDefault() {
        if (!state.selectedSample && state.samples.length) state.selectedSample = state.samples[0];
        if (!state.selectedSample) {
          await initSamples();
          return;
        }
        await selectSample(state.selectedSample.lessonNo);
      }

      function renderLessonList() {
        $("#lessonList").innerHTML = state.samples.length ? state.samples.map((sample) => `
          <button class="lesson-chip ${sample.lessonNo === state.selectedSample?.lessonNo ? "active" : ""}" type="button" data-lesson-no="${sample.lessonNo}">
            <span>${escapeHtml(sample.label)}</span>
            <span class="count">${escapeHtml(sample.counts?.vocabulary || 0)}</span>
            ${sample.hasAudio ? "<span aria-label=\"有音频区间标注\">▶</span>" : ""}
          </button>
        `).join("") : `<span class="status">暂无样例</span>`;
        $("#lessonList").querySelectorAll("button[data-lesson-no]").forEach((button) => {
          button.addEventListener("click", () => {
            selectSample(Number(button.dataset.lessonNo)).catch((error) => setStatus(error.message, true));
          });
        });
      }

      async function generateAudioAlignment() {
        const lessonNo = state.selectedSample?.lessonNo || lessonNoFromData() || 1;
        setStatus("正在生成音频区间标注...");
        $("#generateAudio").disabled = true;
        try {
          const response = await fetch("/api/ocr/audio-align", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ lessonId: lessonNo, target: "vocabulary", force: true })
          });
          const result = await response.json();
          if (!response.ok) throw new Error(result.error || `生成失败：${response.status}`);
          await refreshSamples(lessonNo);
          await selectSample(lessonNo);
          const vocabularyOutput = (result.outputs || []).find((item) => item.outputPath?.includes("-vocabulary-audio-verified.json"));
          const summary = vocabularyOutput?.track;
          setStatus(summary ? `音频区间标注已生成：${summary.alignedItems || summary.expectedItems || 0} 条。` : "音频区间标注已生成。");
        } catch (error) {
          setStatus(error.message, true);
        } finally {
          $("#generateAudio").disabled = false;
        }
      }

      function render() {
        const data = state.data;
        const words = data?.vocabulary || [];
        $("#summary").textContent = data ? summaryText(data, words) : "未加载";
        renderImage(data);
        renderWord(words[state.index], words.length);
        renderWordList(words);
        scheduleCurrentWordPlayback(words[state.index]);
      }

      function summaryText(data, words) {
        const stats = words.reduce((acc, word) => {
          const review = audioReviewState(word);
          if (review.status === "approved") acc.approved += 1;
          else acc.pending += 1;
          if (review.severity === "risk") acc.risk += 1;
          return acc;
        }, { approved: 0, pending: 0, risk: 0 });
        const reviewStatus = data.audioAlignment?.reviewStatus || "unknown";
        return `${data.lessonId || "unknown"} · ${words.length} 个词 · ${stats.approved} approved · ${stats.pending} pending · ${stats.risk} 高风险 · ${reviewStatus}`;
      }

      function lessonNoFromData() {
        const match = String(state.data?.lessonId || "").match(/\d+/);
        return match ? Number(match[0]) : 0;
      }

      function renderImage(data) {
        const image = data?.sourceImages?.[0];
        const src = assetSrc(image?.path);
        $("#sourceImage").src = src;
        $("#sourceImage").hidden = !src;
        $("#imageLink").href = src || "#";
        $("#imageLabel").textContent = image ? `page${image.pageNo || ""} · ${image.path}` : "教材图片";
      }

      function renderWord(word, total) {
        if (!word) {
          $("#wordCard").innerHTML = `<div class="word-card"><div class="word-body">暂无单词数据。</div></div>`;
          return;
        }
        const meanings = Array.isArray(word.meaningZh) ? word.meaningZh : [word.meaningZh].filter(Boolean);
        const meaningText = meanings.length ? meanings.map(escapeHtml).join(" / ") : "暂无中文释义";
        const audioReview = audioReviewState(word);
        $("#wordCard").innerHTML = `
          <article class="word-card">
            <div class="word-nav">
              <div class="word-nav-side">
                <span class="word-shortcut" aria-hidden="true"><span class="word-shortcut-key">←</span><span>键切换上一个</span></span>
                <button id="prevWord" type="button" ${state.index <= 0 ? "disabled" : ""}>上一个</button>
              </div>
              <span class="word-index">${state.index + 1} / ${total}</span>
              <div class="word-nav-side right">
                <button id="nextWord" type="button" ${state.index >= total - 1 ? "disabled" : ""}>下一个</button>
                <span class="word-shortcut" aria-hidden="true"><span>键切换下一个</span><span class="word-shortcut-key">→</span></span>
              </div>
            </div>
            <div class="word-body">
              <div class="word-main">
                <div class="jp">
                  <strong class="writing">${renderWordWriting(word)}</strong>
                  <span class="meaning-inline">${meaningText}</span>
                </div>
                <div class="meta">
                  <span class="tag">${escapeHtml(word.id || "")}</span>
                  <span class="tag">${escapeHtml(word.partOfSpeech || "无词性")}</span>
                  <span class="tag ${word.confidence === "low" ? "warn" : ""}">${escapeHtml(word.confidence || "unknown")}</span>
                  <span class="tag ${audioReview.tagClass}">${escapeHtml(audioReview.label)}</span>
                </div>
              </div>
              ${word.audioSegment ? `
                <div class="audio-row">
                  <button class="audio-button" id="playWordAudio" type="button" title="播放音频片段" aria-label="播放音频片段">▶</button>
                  <button class="audio-button segment-settings" id="editWordAudio" type="button" title="设置音频区间" aria-label="设置音频区间">⚙</button>
                  <span>${escapeHtml(formatSegmentTime(word.audioSegment))}</span>
                </div>
                ${renderAudioReview(word.audioSegment, audioReview)}
              ` : ""}
            </div>
          </article>
        `;
        $("#prevWord")?.addEventListener("click", () => move(-1));
        $("#nextWord")?.addEventListener("click", () => move(1));
        $("#playWordAudio")?.addEventListener("click", () => playSegment(word.audioSegment));
        $("#editWordAudio")?.addEventListener("click", () => openSegmentModal(word.id).catch((error) => setStatus(error.message, true)));
      }

      function renderWordWriting(word) {
        const writing = String(word?.writing || word?.kana || "");
        const kana = String(word?.kana || "");
        if (!writing || !kana || writing === kana || !hasKanji(writing)) return escapeHtml(writing);
        return wordRubySegments(writing, kana).map((segment) => {
          if (!segment.ruby) return escapeHtml(segment.text);
          return `<ruby><rb>${escapeHtml(segment.text)}</rb><rt aria-hidden="true">${escapeHtml(segment.ruby)}</rt></ruby>`;
        }).join("");
      }

      function hasKanji(value) {
        return /[\u3400-\u9fff々〆ヵヶ]/.test(value);
      }

      function isKanjiChar(char) {
        return /[\u3400-\u9fff々〆ヵヶ]/.test(char);
      }

      function toHiragana(value) {
        return String(value || "").replace(/[\u30a1-\u30f6]/g, (char) =>
          String.fromCharCode(char.charCodeAt(0) - 0x60)
        );
      }

      function wordRubySegments(writing, kana) {
        const chars = [...writing];
        const tokens = [];
        for (const char of chars) {
          const kind = isKanjiChar(char) ? "kanji" : "plain";
          const last = tokens[tokens.length - 1];
          if (last?.kind === kind) last.text += char;
          else tokens.push({ kind, text: char });
        }
        if (tokens.every((token) => token.kind === "kanji")) {
          return [{ text: writing, ruby: kana }];
        }

        const segments = [];
        let kanaCursor = 0;
        const normalizedKana = toHiragana(kana);

        tokens.forEach((token, index) => {
          if (token.kind === "plain") {
            const reading = toHiragana(token.text);
            if (normalizedKana.slice(kanaCursor).startsWith(reading)) kanaCursor += reading.length;
            segments.push({ text: token.text });
            return;
          }

          const nextPlain = tokens.slice(index + 1).find((item) => item.kind === "plain");
          let rubyEnd = kana.length;
          if (nextPlain) {
            const nextReading = toHiragana(nextPlain.text);
            const found = normalizedKana.indexOf(nextReading, kanaCursor + 1);
            if (found >= 0) rubyEnd = found;
          }
          const ruby = kana.slice(kanaCursor, rubyEnd);
          kanaCursor = rubyEnd;
          segments.push(ruby ? { text: token.text, ruby } : { text: token.text });
        });

        return segments;
      }

      function renderWordList(words) {
        $("#wordList").innerHTML = words.map((word, index) => `
          <button type="button" class="${wordListClass(word, index)}" data-index="${index}">
            <span class="word-list-main">
              <strong>${escapeHtml(word.writing || word.kana)}</strong>
              ${renderReviewDot(word)}
            </span>
          </button>
        `).join("");
        $("#wordList").querySelectorAll("button").forEach((button) => {
          button.addEventListener("click", () => {
            state.index = Number(button.dataset.index) || 0;
            render();
          });
        });
      }

      function move(offset) {
        const total = state.data?.vocabulary?.length || 0;
        state.index = Math.max(0, Math.min(total - 1, state.index + offset));
        render();
      }

      function isEditableTarget(target) {
        const element = target instanceof Element ? target : null;
        return Boolean(element && element.closest("input, textarea, select, [contenteditable=''], [contenteditable='true']"));
      }

      function handleWordNavigationKeydown(event) {
        if (event.defaultPrevented || event.altKey || event.ctrlKey || event.metaKey) return;
        if (isEditableTarget(event.target)) return;
        if ($("#segmentModal").classList.contains("open")) return;
        if (event.key !== "ArrowLeft" && event.key !== "ArrowRight") return;
        if (!state.data?.vocabulary?.length) return;
        event.preventDefault();
        move(event.key === "ArrowLeft" ? -1 : 1);
      }

      function scheduleCurrentWordPlayback(word) {
        const segment = word?.audioSegment;
        if (!segment) return;
        const token = ++state.autoPlayToken;
        window.requestAnimationFrame(() => {
          window.setTimeout(() => {
            if (token !== state.autoPlayToken) return;
            if (state.data?.vocabulary?.[state.index]?.id !== word?.id) return;
            playSegment(segment);
          }, 40);
        });
      }

      function formatSegmentTime(segment) {
        return `${Number(segment.start || 0).toFixed(3)}s - ${Number(segment.end || 0).toFixed(3)}s`;
      }

      function renderAudioReview(segment, review) {
        const raw = segment.rawAzureTiming;
        const timingLabel = segment.timingSource === "audio-silence-detection" ? "静音边界" : "Azure 时间戳";
        return `
          <div class="audio-review ${review.severity === "risk" ? "danger" : review.status === "pending" ? "warn" : ""}">
            <div class="audio-review-line">
              <span>状态：${escapeHtml(review.label)}</span>
              <span>边界：${escapeHtml(timingLabel)}</span>
              <span>分数：${escapeHtml(formatOptionalNumber(segment.matchScore))}</span>
              <span>时长：${escapeHtml(formatOptionalNumber(segment.duration))}s</span>
              ${raw ? `<span>Azure：${escapeHtml(formatSegmentTime(raw))}</span>` : ""}
            </div>
            ${segment.asrText ? `<div>ASR：${escapeHtml(segment.asrText)}</div>` : ""}
            ${review.reasons.length ? `<div>原因：${review.reasons.map(escapeHtml).join("；")}</div>` : ""}
            ${Array.isArray(segment.alignmentWarnings) && segment.alignmentWarnings.length
              ? `<div>诊断：${segment.alignmentWarnings.map((warning) => escapeHtml(readableAlignmentWarning(warning))).join("；")}</div>`
              : ""}
          </div>
        `;
      }

      function wordListClass(word, index) {
        const review = audioReviewState(word);
        return [
          index === state.index ? "active" : "",
          review.severity === "risk" ? "review-risk" : review.status === "pending" ? "review-pending" : ""
        ].filter(Boolean).join(" ");
      }

      function renderReviewDot(word) {
        const review = audioReviewState(word);
        if (!word.audioSegment) return "";
        if (review.severity === "risk") return `<span class="review-dot risk" title="${escapeHtml(review.reasons.join("；"))}">!</span>`;
        if (review.status === "pending") return `<span class="review-dot pending" title="${escapeHtml(review.reasons.join("；"))}">待</span>`;
        return `<span class="review-dot" title="approved">✓</span>`;
      }

      function audioReviewState(word) {
        const segment = word?.audioSegment;
        if (!segment) {
          return { status: "pending", severity: "risk", label: "无音频", tagClass: "danger", reasons: ["没有音频区间"] };
        }
        const status = segment.review?.status || "pending";
        const reasons = audioRiskReasons(word, segment);
        const severity = reasons.some((reason) => /低匹配|极短|重叠|无效|边界过近/.test(reason))
          || segment.review?.severity === "risk"
          ? "risk"
          : status === "pending" || reasons.length ? "pending" : "ok";
        const label = status === "approved" && severity === "ok" ? "approved" : status === "approved" ? "approved · 可疑" : "pending";
        return {
          status: status === "approved" && severity === "ok" ? "approved" : "pending",
          severity,
          label,
          tagClass: severity === "risk" ? "danger" : status === "approved" && severity === "ok" ? "" : "warn",
          reasons
        };
      }

      function audioRiskReasons(word, segment) {
        const reasons = [];
        const score = Number(segment.matchScore);
        const duration = Number(segment.duration);
        const start = Number(segment.start);
        const end = Number(segment.end);
        const minDuration = expectedMinimumDuration(word);
        const hasReliableAudioBoundary = segment.timingSource === "audio-silence-detection"
          && segment.timingConfidence === "high";
        if (!Number.isFinite(start) || !Number.isFinite(end) || end <= start) reasons.push("无效时间区间");
        if (!hasReliableAudioBoundary) {
          if (Number.isFinite(score) && score < 0.65) reasons.push(`低匹配分 ${score.toFixed(3)}`);
          if (Number.isFinite(duration) && duration < 0.35) reasons.push(`极短时长 ${duration.toFixed(3)}s`);
          if (Number.isFinite(duration) && duration < minDuration * 0.55) reasons.push(`短于预估 ${duration.toFixed(3)}s / ${minDuration.toFixed(3)}s`);
        }
        if (Array.isArray(segment.alignmentIssues) && segment.alignmentIssues.length) reasons.push(...segment.alignmentIssues.map(readableAlignmentIssue));
        if (segment.review?.status && segment.review.status !== "approved") reasons.push(`未人工确认 ${segment.review.status}`);
        if (segment.review?.note && /Pending manual verification/i.test(segment.review.note)) reasons.push("脚本要求人工验证");
        return [...new Set(reasons.filter(Boolean))];
      }

      function expectedMinimumDuration(word) {
        const text = String(word?.kana || word?.writing || "");
        const normalized = normalizeWordTextForReview(text);
        const units = Math.max(1, [...normalized.replace(/[ゃゅょぁぃぅぇぉャュョァィゥェォ]/gu, "")].length);
        return Math.min(1.5, Math.max(0.45, units * 0.28));
      }

      function normalizeWordTextForReview(value) {
        return String(value || "").normalize("NFKC").replace(/[\s\p{P}\p{S}]/gu, "").toLowerCase();
      }

      function readableAlignmentIssue(issue) {
        const text = String(issue || "");
        if (text.startsWith("expanded-start:")) return `自动前扩 ${text.replace("expanded-start:", "")}`;
        if (text.startsWith("short-azure-timing:")) return `Azure 原始时间过短 ${text.replace("short-azure-timing:", "")}`;
        if (text.startsWith("large-heuristic-expansion:")) return `大幅启发式扩展 ${text.replace("large-heuristic-expansion:", "")}`;
        if (text === "neighbor-boundary-too-tight") return "相邻词边界过近";
        return text;
      }

      function readableAlignmentWarning(warning) {
        const text = String(warning || "");
        if (text === "azure-timing-does-not-overlap-vad") return "Azure 时间与静音边界不重合，已采用静音边界";
        if (text.startsWith("low-asr-text-match:")) return `ASR 文字匹配较低 ${text.replace("low-asr-text-match:", "")}`;
        return text;
      }

      function formatOptionalNumber(value) {
        const number = Number(value);
        return Number.isFinite(number) ? number.toFixed(3) : "unknown";
      }

      async function playSegment(segment) {
        if (!segment?.sourceUrl) {
          setStatus("当前条目没有音频片段。", true);
          return;
        }
        clearInterval(state.stopTimer);
        state.audio.pause();
        state.audio.src = segment.sourceUrl;
        try {
          await waitForAudioMetadata();
          state.audio.currentTime = Math.max(0, Number(segment.start) || 0);
          state.stopTimer = window.setInterval(() => {
            if (state.audio.currentTime >= Number(segment.end || 0)) {
              state.audio.pause();
              clearInterval(state.stopTimer);
            }
          }, 30);
          await state.audio.play();
        } catch (error) {
          clearInterval(state.stopTimer);
          setStatus(`播放失败：${error.message}`, true);
        }
      }

      function modalStatus(message, isError = false) {
        $("#segmentModalStatus").textContent = message || "";
        $("#segmentModalStatus").classList.toggle("error", Boolean(isError));
      }

      async function loadEditableSegment(wordId) {
        const word = (state.data?.vocabulary || []).find((item) => item?.id === wordId);
        const lessonNo = state.selectedSample?.lessonNo || lessonNoFromData() || lessonNoFromLocation();
        const editableSegment = word?.audioSegment || null;
        if (!word || !editableSegment) throw new Error("当前单词没有可编辑的音频区间。");
        return { word, lessonNo, segment: editableSegment };
      }

      async function openSegmentModal(wordId) {
        const editing = await loadEditableSegment(wordId);
        state.editing = editing;
        const label = editing.word.writing && editing.word.writing !== editing.word.kana
          ? `${editing.word.writing}（${editing.word.kana || ""}）`
          : editing.word.kana || editing.word.writing || editing.word.id;
        $("#segmentModalText").textContent = label;
        $("#segmentStart").value = Number(editing.segment.start || 0).toFixed(3);
        $("#segmentEnd").value = Number(editing.segment.end || 0).toFixed(3);
        modalStatus(`当前区间：${formatSegmentTime(editing.segment)}`);
        $("#segmentModal").classList.add("open");
        $("#segmentModal").setAttribute("aria-hidden", "false");
        $("#segmentStart").focus();
      }

      function closeSegmentModal() {
        state.editing = null;
        $("#segmentModal").classList.remove("open");
        $("#segmentModal").setAttribute("aria-hidden", "true");
      }

      function editedRange() {
        const start = Number($("#segmentStart").value);
        const end = Number($("#segmentEnd").value);
        if (!Number.isFinite(start) || !Number.isFinite(end) || start < 0 || end <= start) {
          throw new Error("请填写有效的开始和结束时间。");
        }
        return {
          start: Math.round(start * 1000) / 1000,
          end: Math.round(end * 1000) / 1000
        };
      }

      async function testEditedSegment() {
        if (!state.editing) return;
        try {
          const range = editedRange();
          await playSegment({ ...state.editing.segment, ...range });
          modalStatus(`测试播放：${range.start.toFixed(3)}s - ${range.end.toFixed(3)}s`);
        } catch (error) {
          modalStatus(error.message, true);
        }
      }

      async function saveEditedSegment() {
        if (!state.editing) return;
        try {
          const range = editedRange();
          modalStatus("正在保存...");
          $("#saveSegment").disabled = true;
          const response = await fetch("/api/ocr/vocabulary-audio-segment", {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              lessonId: state.editing.lessonNo,
              itemId: state.editing.word.id,
              start: range.start,
              end: range.end
            })
          });
          const result = await response.json();
          if (!response.ok) throw new Error(result.error || `保存失败：${response.status}`);
          state.editing.word.audioSegment = result.audioSegment;
          $("#jsonInput").value = JSON.stringify(state.data, null, 2);
          render();
          closeSegmentModal();
          setStatus(`音频区间已保存：${result.updatedFiles.join("，")}`);
        } catch (error) {
          modalStatus(error.message, true);
        } finally {
          $("#saveSegment").disabled = false;
        }
      }

      function waitForAudioMetadata() {
        if (state.audio.readyState >= 1) return Promise.resolve();
        state.audio.load();
        return new Promise((resolve, reject) => {
          const cleanup = () => {
            state.audio.removeEventListener("loadedmetadata", handleLoaded);
            state.audio.removeEventListener("error", handleError);
          };
          const handleLoaded = () => {
            cleanup();
            resolve();
          };
          const handleError = () => {
            cleanup();
            reject(new Error("音频加载失败"));
          };
          state.audio.addEventListener("loadedmetadata", handleLoaded);
          state.audio.addEventListener("error", handleError);
        });
      }

      $("#loadDefault").addEventListener("click", () => loadDefault().catch((error) => setStatus(error.message, true)));
      $("#generateAudio").addEventListener("click", generateAudioAlignment);
      $("#parseInput").addEventListener("click", () => {
        try {
          setData(JSON.parse($("#jsonInput").value), "文本框 JSON");
        } catch (error) {
          setStatus(error.message, true);
        }
      });
      $("#fileInput").addEventListener("change", async (event) => {
        const file = event.target.files?.[0];
        if (!file) return;
        try {
          setData(JSON.parse(await file.text()), file.name);
        } catch (error) {
          setStatus(error.message, true);
        }
      });
      $("#closeSegmentModal").addEventListener("click", closeSegmentModal);
      $("#segmentModal").addEventListener("click", (event) => {
        if (event.target.id === "segmentModal") closeSegmentModal();
      });
      $("#testSegmentPlay").addEventListener("click", testEditedSegment);
      $("#saveSegment").addEventListener("click", saveEditedSegment);
      document.addEventListener("keydown", handleWordNavigationKeydown, true);

      initPanelResizer();
      initSamples().catch((error) => setStatus(error.message, true));
    </script>
  </body>
</html>
