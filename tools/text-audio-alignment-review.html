<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>课文音频对齐审核</title>
    <style>
      :root { --bg:#f5f7f9; --surface:#fff; --text:#16202a; --muted:#647282; --line:#d6dde5; --blue:#176b87; --blue-soft:#e6f2f6; --green:#1f7a55; --amber:#9a6212; --red:#b42318; }
      * { box-sizing:border-box; }
      body { margin:0; background:var(--bg); color:var(--text); font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
      header { position:sticky; top:0; z-index:2; display:flex; gap:12px; align-items:center; padding:12px 18px; border-bottom:1px solid var(--line); background:rgba(255,255,255,.96); }
      h1 { margin:0 auto 0 0; font-size:18px; font-weight:650; }
      button,input,textarea { font:inherit; }
      button { min-height:32px; padding:6px 10px; border:1px solid var(--line); border-radius:5px; background:var(--surface); color:var(--text); cursor:pointer; }
      button:hover { border-color:var(--blue); } button.primary { border-color:var(--blue); background:var(--blue); color:#fff; } button.publish { border-color:var(--green); background:var(--green); color:#fff; }
      input { height:32px; border:1px solid var(--line); border-radius:4px; padding:4px 7px; color:var(--text); background:#fff; } input[type=number] { width:88px; font-variant-numeric:tabular-nums; }
      main { max-width:1320px; margin:0 auto; padding:18px; }
      .summary { display:flex; flex-wrap:wrap; gap:10px 18px; margin:0 0 14px; color:var(--muted); } .status { min-height:20px; margin-bottom:12px; color:var(--muted); } .status.error { color:var(--red); }
      .track { border-top:2px solid var(--line); margin-top:18px; } .track h2 { margin:0; padding:12px 0 7px; font-size:15px; }
      .row { display:grid; grid-template-columns:minmax(260px,1.25fr) minmax(220px,1fr) 164px 178px; gap:12px; align-items:start; padding:12px 0; border-top:1px solid var(--line); }
      .line { font-size:16px; } .translation,.asr,.meta { color:var(--muted); margin-top:3px; } .asr { font-size:12px; } .meta { font-size:12px; font-variant-numeric:tabular-nums; }
      .controls { display:flex; flex-wrap:wrap; gap:6px; } .time { display:grid; grid-template-columns:1fr 1fr; gap:6px; } .time label { color:var(--muted); font-size:11px; } .time input { display:block; width:100%; margin-top:2px; }
      textarea { width:100%; min-height:54px; resize:vertical; border:1px solid var(--line); border-radius:4px; padding:6px; } .review-state { display:flex; gap:6px; margin-bottom:6px; } .review-state button { flex:1; padding:4px; font-size:12px; } .review-state .selected-approved { border-color:var(--green); color:var(--green); background:#edf8f2; } .review-state .selected-needs-adjustment { border-color:var(--amber); color:var(--amber); background:#fff7e8; } .review-state .selected-pending { border-color:var(--line); background:#f1f4f6; }
      .empty { padding:36px 0; color:var(--muted); text-align:center; } @media (max-width:900px) { header { flex-wrap:wrap; } h1 { width:100%; } .row { grid-template-columns:1fr; gap:8px; } .summary { margin-top:8px; } }
    </style>
  </head>
  <body>
    <header>
      <h1>课文音频对齐审核</h1>
      <label>课次 <input id="lesson" type="number" min="1" max="48" value="18" /></label>
      <button id="load">加载</button>
      <button class="primary" id="generate">重新生成候选</button>
      <button id="save">保存审核</button>
      <button class="publish" id="publish">发布已确认片段</button>
    </header>
    <main>
      <div id="summary" class="summary"></div>
      <div id="status" class="status"></div>
      <div id="tracks" class="empty">加载第 18 课候选对齐数据。</div>
    </main>
    <script type="module">
      const state = { data:null, audio:new Audio() };
      const $ = (selector) => document.querySelector(selector);
      const escapeHtml = (value) => String(value ?? "").replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;").replaceAll('"', "&quot;");
      const requestedLesson = Number(new URLSearchParams(location.search).get("lesson"));
      if (Number.isInteger(requestedLesson) && requestedLesson >= 1 && requestedLesson <= 48) $("#lesson").value = String(requestedLesson);
      const lessonId = () => Math.max(1, Math.min(48, Math.floor(Number($("#lesson").value) || 18)));
      const setStatus = (value, error = false) => { $("#status").textContent = value; $("#status").classList.toggle("error", error); };
      const time = (value) => Number(value || 0).toFixed(3);
      function render() {
        const data = state.data;
        if (!data) { $("#tracks").className = "empty"; $("#tracks").textContent = "尚未加载候选数据。"; return; }
        const items = data.tracks.flatMap((track) => track.items || []);
        const approved = items.filter((item) => item.review?.status === "approved").length;
        $("#summary").innerHTML = `<span>${escapeHtml(data.lessonId)}</span><span>${items.length} 条待核对</span><span>${approved} 条已确认</span><span>算法：逐词时间戳 + 全局单调对齐</span>`;
        $("#tracks").className = "";
        $("#tracks").innerHTML = data.tracks.map((track) => `<section class="track"><h2>${escapeHtml(track.id)} · ${track.items.length} 句</h2>${track.items.map((item) => row(track, item)).join("")}</section>`).join("");
        bind();
      }
      function row(track, item) {
        const review = item.review || {}; const status = review.status || "pending";
        return `<article class="row" data-id="${escapeHtml(item.id)}" data-track="${escapeHtml(track.id)}" data-status="${escapeHtml(status)}">
          <div><div class="line">${escapeHtml(item.speaker ? `${item.speaker}：` : "")}${escapeHtml(item.text)}</div><div class="translation">${escapeHtml(item.translationZh)}</div><div class="asr">ASR：${escapeHtml(item.candidate.asrText)}</div><div class="meta">匹配 ${time(item.candidate.matchScore)} · ASR 置信度 ${time(item.candidate.confidence)}</div></div>
          <div class="controls"><button data-play>播放句子</button><button data-context>播放前后文</button><button data-shift="-0.1">开始 -0.1</button><button data-shift="0.1">开始 +0.1</button><button data-end-shift="-0.1">结束 -0.1</button><button data-end-shift="0.1">结束 +0.1</button></div>
          <div class="time"><label>开始<input data-start type="number" step="0.01" min="0" value="${time(review.start)}" /></label><label>结束<input data-end type="number" step="0.01" min="0" value="${time(review.end)}" /></label></div>
          <div><div class="review-state"><button data-status="approved" class="${status === "approved" ? "selected-approved" : ""}">确认</button><button data-status="needs-adjustment" class="${status === "needs-adjustment" ? "selected-needs-adjustment" : ""}">需调整</button><button data-status="pending" class="${status === "pending" ? "selected-pending" : ""}">待核对</button></div><textarea data-note placeholder="审核备注">${escapeHtml(review.note || "")}</textarea></div>
        </article>`;
      }
      function bind() {
        document.querySelectorAll("[data-status]").forEach((button) => button.onclick = () => { const row = button.closest(".row"); row.dataset.status = button.dataset.status; row.querySelectorAll("[data-status]").forEach((item) => item.className = item.dataset.status === button.dataset.status ? `selected-${button.dataset.status}` : ""); });
        document.querySelectorAll("[data-play],[data-context]").forEach((button) => button.onclick = () => { const row = button.closest(".row"); const item = findItem(row.dataset.id); const start = Number(row.querySelector("[data-start]").value); const end = Number(row.querySelector("[data-end]").value); play(item.track, button.hasAttribute("data-context") ? Math.max(0, start - .4) : start, button.hasAttribute("data-context") ? end + .4 : end); });
        document.querySelectorAll("[data-shift],[data-end-shift]").forEach((button) => button.onclick = () => { const row = button.closest(".row"); const input = row.querySelector(button.hasAttribute("data-shift") ? "[data-start]" : "[data-end]"); input.value = (Number(input.value) + Number(button.dataset.shift || button.dataset.endShift)).toFixed(3); });
      }
      function findItem(id) { for (const track of state.data.tracks) { const item = track.items.find((entry) => entry.id === id); if (item) return { track, item }; } return null; }
      async function play(trackInfo, start, end) { clearInterval(state.timer); state.audio.pause(); state.audio.src = trackInfo.sourceUrl; await new Promise((resolve, reject) => { state.audio.onloadedmetadata = resolve; state.audio.onerror = () => reject(new Error("音频加载失败")); state.audio.load(); }); state.audio.currentTime = start; state.timer = setInterval(() => { if (state.audio.currentTime >= end) { state.audio.pause(); clearInterval(state.timer); } }, 20); await state.audio.play(); }
      async function load() { setStatus("正在加载..."); try { const response = await fetch(`/api/ocr/text-audio-alignment?lessonId=${lessonId()}`, { cache:"no-store" }); const data = await response.json(); if (!response.ok) throw new Error(data.error || "加载失败"); state.data = data; render(); setStatus("候选已加载。逐条播放并确认内容与边界后保存。"); } catch (error) { state.data = null; render(); setStatus(error.message, true); } }
      function changes() { return [...document.querySelectorAll(".row")].map((row) => ({ id:row.dataset.id, status:row.dataset.status || "pending", start:Number(row.querySelector("[data-start]").value), end:Number(row.querySelector("[data-end]").value), note:row.querySelector("[data-note]").value })); }
      async function save() { if (!state.data) return false; setStatus("正在保存..."); const response = await fetch("/api/ocr/text-audio-alignment", { method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify({ lessonId:lessonId(), changes:changes() }) }); const data = await response.json(); if (!response.ok) { setStatus(data.error || "保存失败", true); return false; } state.data = data; render(); setStatus("审核状态已保存。"); return true; }
      async function generate() { if (!confirm("重新生成会覆盖当前候选与审核状态。继续？")) return; setStatus("正在转写和对齐原始音轨，这需要约两分钟..."); const response = await fetch("/api/ocr/text-audio-alignment/generate", { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({ lessonId:lessonId() }) }); const data = await response.json(); if (!response.ok) { setStatus(data.error || "生成失败", true); return; } await load(); }
      async function publish() { if (!await save()) return; setStatus("正在导出已确认的独立音频..."); const response = await fetch("/api/ocr/text-audio-alignment/publish", { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({ lessonId:lessonId() }) }); const data = await response.json(); if (!response.ok) { setStatus(data.error || "发布失败", true); return; } setStatus(`已发布 ${data.approvedSegments} 条：${data.outputPath}`); }
      $("#load").onclick = load; $("#generate").onclick = generate; $("#save").onclick = save; $("#publish").onclick = publish; load();
    </script>
  </body>
</html>
