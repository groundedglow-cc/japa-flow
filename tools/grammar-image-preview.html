<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>语法图片预览</title>
    <script>
      if (new URLSearchParams(location.search).get("embedded") === "1") {
        document.documentElement.classList.add("embedded");
      }
    </script>
    <style>
      :root {
        --bg: #f5f7f6;
        --panel: #ffffff;
        --ink: #18231e;
        --muted: #65736c;
        --line: #d9e2dd;
        --accent: #18875a;
        --accent-soft: #e8f5ee;
        --shadow: 0 18px 48px rgba(24, 35, 30, 0.08);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      button {
        border: 0;
        font: inherit;
        cursor: pointer;
      }

      .shell {
        width: min(100% - 40px, 1280px);
        margin: 0 auto;
        padding: 28px 0 42px;
      }

      .page-head {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 18px;
      }

      .eyebrow {
        margin: 0 0 5px;
        color: var(--accent);
        font-size: 13px;
        font-weight: 820;
        letter-spacing: 0;
      }

      h1,
      h2 {
        margin: 0;
        letter-spacing: 0;
      }

      h1 {
        font-size: 30px;
        line-height: 1.18;
      }

      h2 {
        font-size: 23px;
        line-height: 1.24;
      }

      .summary {
        display: inline-flex;
        align-items: center;
        min-height: 34px;
        padding: 0 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        color: var(--muted);
        font-size: 13px;
        font-weight: 780;
      }

      .layout {
        display: grid;
        grid-template-columns: 310px minmax(0, 1fr);
        gap: 22px;
        align-items: start;
      }

      .lesson-panel,
      .viewer {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        box-shadow: var(--shadow);
      }

      .lesson-panel {
        position: sticky;
        top: 18px;
        max-height: calc(100vh - 36px);
        overflow: auto;
        padding: 14px;
      }

      .lesson-panel-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .lesson-panel-head {
        margin-bottom: 12px;
      }

      .lesson-panel-head strong {
        font-size: 15px;
      }

      .lesson-panel-head span {
        color: var(--muted);
        font-size: 12px;
        font-weight: 780;
      }

      .lesson-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
      }

      .lesson-entry {
        display: flex;
        align-items: center;
        gap: 8px;
        min-height: 52px;
        padding: 8px;
        border: 1px solid #dce6e1;
        border-radius: 8px;
        background: #fbfdfc;
        color: var(--ink);
        text-align: left;
      }

      .lesson-entry:hover {
        border-color: #b9cfc4;
        background: #f4faf7;
      }

      .lesson-entry.active {
        border-color: var(--accent);
        background: var(--accent-soft);
      }

      .lesson-no {
        display: grid;
        place-items: center;
        width: 28px;
        height: 28px;
        flex: 0 0 auto;
        border-radius: 8px;
        background: #eef3f0;
        color: var(--muted);
        font-size: 13px;
        font-weight: 850;
      }

      .lesson-entry.active .lesson-no {
        background: var(--accent);
        color: #fff;
      }

      .lesson-meta {
        display: grid;
        gap: 2px;
        min-width: 0;
      }

      .lesson-meta span,
      .lesson-meta small {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .lesson-meta span {
        font-size: 13px;
        font-weight: 820;
      }

      .lesson-meta small {
        color: var(--muted);
        font-size: 11px;
        font-weight: 720;
      }

      .viewer {
        display: grid;
        gap: 18px;
        min-width: 0;
        padding: 22px;
      }

      .image-stack {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 16px;
      }

      .image-frame {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        align-items: start;
        width: 100%;
        margin: 0;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
      }

      .grammar-source { border-right: 1px solid var(--line); }

      .grammar-source, .grammar-interaction { min-width: 0; }
      .grammar-page-mode { display: none; }
      .grammar-examples { padding: 18px; }
      .grammar-group + .grammar-group { margin-top: 32px; padding-top: 24px; border-top: 2px solid var(--line); }
      .grammar-group h3 { margin: 0 0 10px; font-size: 16px; color: var(--accent); }
      .grammar-example + .grammar-example { margin-top: 3px; }
      .grammar-note, .grammar-empty { color: var(--muted); font-size: 12px; line-height: 1.7; }
      .grammar-example.incorrect { border-left: 3px solid #b34c35; padding-left: 10px; }
      .grammar-example.incorrect .grammar-note { color: #a13d27; }
      .grammar-sentence { display: block; width: 100%; padding: 2px 8px; border-radius: 6px; background: transparent; color: var(--ink); text-align: left; overflow-wrap: anywhere; }
      .grammar-sentence:hover, .grammar-sentence.playing { background: var(--accent-soft); }
      .grammar-sentence:focus-visible { outline: 2px solid var(--accent); }
      .grammar-sentence .jp { font-size: 17px; line-height: 1.65; }
      .grammar-sentence ruby { ruby-align: center; }
      .grammar-sentence, .grammar-sentence .jp { user-select:text; -webkit-user-select:text; cursor:text; }
      .grammar-sentence rt { color: var(--muted); font-size: 11px; font-weight: 500; }

      .grammar-vocabulary {
        padding: 10px 12px;
        border-bottom: 1px solid var(--line);
        background: #f5fbfd;
      }

      .grammar-vocabulary-toggle {
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 100%;
        padding: 0;
        background: transparent;
        color: var(--muted);
        font-size: 12px;
        font-weight: 760;
        text-align: left;
      }

      .grammar-vocabulary-toggle strong {
        color: var(--accent);
      }

      .grammar-vocabulary-toggle:hover strong,
      .grammar-vocabulary-toggle:focus-visible strong {
        text-decoration: underline;
      }

      .grammar-vocabulary-items {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 8px;
      }

      .grammar-vocabulary-chip-wrap {
        display: inline-flex;
        align-items: flex-end;
        gap: 5px;
      }

      .grammar-vocabulary-chip {
        position: relative;
        display: inline-flex;
        align-items: flex-end;
        gap: 6px;
        min-height: 31px;
        border: 1px solid var(--line);
        border-radius: 9px;
        background: #fff;
        color: var(--ink);
        padding: 5px 27px 5px 9px;
        cursor: pointer;
        font: inherit;
        font-size: 15px;
        text-align: left;
      }

      .grammar-vocabulary-chip:hover,
      .grammar-vocabulary-chip:focus-visible,
      .grammar-vocabulary-chip.playing {
        border-color: var(--accent);
        outline: none;
      }

      .grammar-vocabulary-chip rt { color: var(--muted); font-size: .72em; }
      .grammar-vocabulary-meaning { color: var(--muted); font-size: 12px; }
      .grammar-vocabulary-pos { position: absolute; top: 3px; right: 4px; min-width: 17px; padding: 1px 3px; border-radius: 4px; background: #0f766e; color: #fff; font-size: 10px; font-weight: 850; line-height: 13px; text-align: center; pointer-events: none; }

      .image-frame img {
        display: block;
        width: 100%;
        height: auto;
        background: #eef2f0;
      }

      .image-error {
        display: none;
        padding: 18px;
        color: #a13d27;
        font-size: 13px;
        font-weight: 760;
      }

      .image-frame.missing .image-error {
        display: block;
      }

      .image-frame.missing img {
        display: none;
      }

      .image-lightbox { display: none; }

      html.embedded .shell {
        width: 100%;
        padding: 0;
      }

      html.embedded .page-head,
      html.embedded .lesson-panel {
        display: none;
      }

      html.embedded .layout {
        display: block;
      }

      html.embedded .viewer {
        border: 0;
        border-radius: 0;
        box-shadow: none;
      }

      html.embedded .image-frame {
        width: 100%;
      }

      @media (max-width: 920px) {
        .shell {
          width: min(100% - 28px, 720px);
          padding-top: 18px;
        }

        .page-head,
        .layout {
          grid-template-columns: 1fr;
        }

        .page-head {
          display: grid;
        }

        .lesson-panel {
          position: static;
          max-height: none;
        }

        .lesson-grid {
          grid-template-columns: repeat(4, minmax(0, 1fr));
        }

        .image-stack {
          grid-template-columns: 1fr;
        }

        .image-frame { display: block; }
        .grammar-source { border-right: 0; }

        .grammar-page-mode { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; padding: 8px; border-bottom: 1px solid var(--line); background: #f8fbf9; }
        .grammar-page-mode button { min-height: 36px; border: 1px solid var(--line); border-radius: 7px; background: #fff; color: var(--muted); font-size: 13px; font-weight: 760; }
        .grammar-page-mode button.active { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
        .image-frame[data-page-mode="source"] .grammar-interaction,
        .image-frame[data-page-mode="listen"] .grammar-source { display: none; }

        .lesson-entry {
          min-height: 46px;
        }

        .lesson-meta span {
          font-size: 12px;
        }
      }

      @media (max-width: 920px) and (hover: none), (max-width: 920px) and (pointer: coarse) {
        .lesson-grid {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }

        .image-stack {
          grid-template-columns: 1fr;
        }

        .viewer {
          padding: 14px;
        }

        .image-frame img { cursor: zoom-in; }
        .image-lightbox { position: fixed; z-index: 100; inset: 0; display: none; background: rgba(8, 18, 27, 0.92); }
        .image-lightbox.open { display: grid; grid-template-rows: auto minmax(0, 1fr); }
        .image-lightbox-toolbar { display: flex; align-items: center; justify-content: flex-end; gap: 8px; padding: 12px; }
        .image-lightbox-toolbar button { min-width: 34px; height: 34px; padding: 0 9px; border: 1px solid rgba(255, 255, 255, 0.35); border-radius: 8px; background: rgba(255, 255, 255, 0.12); color: #fff; font-size: 18px; }
        .image-lightbox-stage { display: grid; min-width: 0; min-height: 0; place-items: center; overflow: auto; padding: 8px 16px 24px; }
        .image-lightbox-stage img { display: block; width: min(100%, 760px); max-width: none; height: auto; transform-origin: center center; transition: transform 150ms ease; }
      }
    </style>
    <link rel="stylesheet" href="/shared/notes/dist/inline-notes.css?v=28199f7d1380">
    <script type="module" src="/shared/notes/dist/inline-notes.js?v=28199f7d1380"></script>
  </head>
  <body>
    <main class="shell">
      <header class="page-head">
        <div>
          <p class="eyebrow">JapaFlow · 语法素材</p>
          <h1>语法图片预览</h1>
        </div>
        <div class="summary" id="summary">48 课</div>
      </header>

      <section class="layout">
        <aside class="lesson-panel" aria-label="课程列表">
          <div class="lesson-panel-head">
            <strong>Lesson</strong>
            <span>第 2-5 张</span>
          </div>
          <div class="lesson-grid" id="lessonGrid"></div>
        </aside>

        <article class="viewer" id="viewer"></article>
      </section>
    </main>
    <div class="image-lightbox" id="imageLightbox" aria-hidden="true">
      <div class="image-lightbox-toolbar">
        <button type="button" data-image-zoom="out" aria-label="缩小图片">−</button>
        <button type="button" data-image-zoom="reset" aria-label="还原图片">1:1</button>
        <button type="button" data-image-zoom="in" aria-label="放大图片">+</button>
        <button type="button" data-image-lightbox-close aria-label="关闭图片">×</button>
      </div>
      <div class="image-lightbox-stage"><img id="imageLightboxImage" alt="放大的语法教材图片" /></div>
    </div>

    <script>
      const firstPages = [
        22, 32, 42, 52, 68, 78, 88, 98, 114, 124, 134, 144,
        160, 170, 180, 190, 206, 216, 226, 236, 252, 262, 272, 282,
        4, 14, 24, 34, 50, 60, 70, 80, 96, 106, 116, 126,
        142, 152, 162, 172, 188, 198, 208, 218, 234, 244, 254, 264
      ];

      const lessons = firstPages.map((firstPage, index) => {
        const lessonNo = index + 1;
        return {
          lessonNo,
          pages: Array.from({ length: 4 }, (_, offset) => firstPage + offset + 1)
        };
      });

      const lessonGrid = document.querySelector("#lessonGrid");
      const viewer = document.querySelector("#viewer");
      const summary = document.querySelector("#summary");
      const imageLightbox = document.querySelector("#imageLightbox");
      const imageLightboxImage = document.querySelector("#imageLightboxImage");
      let imageZoom = 1;
      const grammarVocabularyCache = new Map();
      const grammarExamplesCache = new Map();
      let grammarAudioManifest = null;
      let sentenceAudio = null;
      let sentencePlaybackVersion = 0;
      let activeSentenceButton = null;

      function speechStatus(message) {
        const status = document.querySelector("#speechStatus");
        if (status) status.textContent = message;
      }

      function stopSentence() {
        sentencePlaybackVersion++;
        if (sentenceAudio) {
          sentenceAudio.pause();
          sentenceAudio.removeAttribute("src");
          sentenceAudio.load();
          sentenceAudio = null;
        }
        if (activeSentenceButton) {
          activeSentenceButton.classList.remove("playing");
          activeSentenceButton.setAttribute("aria-pressed", "false");
        }
        activeSentenceButton = null;
      }

      async function playSentence(button) {
        const same = activeSentenceButton === button;
        stopSentence();
        vocabularyAudio.pause();
        document.querySelectorAll(".grammar-vocabulary-chip.playing").forEach((item) => item.classList.remove("playing"));
        if (same) { speechStatus("已停止朗读。"); return; }
        const url = grammarAudioManifest?.sentences?.[button.dataset.sentence];
        if (!url || !/^\/audio\/grammar\/lesson\d+\/(?:azure-[a-z0-9-]+\/)?[a-f0-9]{64}\.mp3$/.test(url)) {
          speechStatus("这句话的标准例句音频尚未生成。");
          return;
        }
        const version = sentencePlaybackVersion;
        const audio = new Audio(url);
        sentenceAudio = audio;
        activeSentenceButton = button;
        button.classList.add("playing");
        button.setAttribute("aria-pressed", "true");
        speechStatus("正在加载标准例句音频…");
        const finish = (message) => {
          if (version !== sentencePlaybackVersion) return;
          stopSentence();
          speechStatus(message);
        };
        audio.addEventListener("ended", () => finish("标准例句音频播放结束，点击句子可再次播放。"), { once: true });
        audio.addEventListener("error", () => finish("标准例句音频加载失败，请稍后重试。"), { once: true });
        try {
          await audio.play();
          if (version === sentencePlaybackVersion) speechStatus("正在播放标准例句音频（再次点击停止）");
        } catch { finish("播放未能开始，请再次点击。"); }
      }
      window.addEventListener("pagehide", () => { stopSentence(); vocabularyAudio.pause(); });
      document.addEventListener("visibilitychange", () => {
        if (document.hidden) { stopSentence(); vocabularyAudio.pause(); }
      });

      async function loadGrammarExamples(lessonNo) {
        if (!grammarExamplesCache.has(lessonNo)) {
          grammarExamplesCache.set(lessonNo, fetch(`../data/ocr/lesson${lessonNo}-grammar-examples.json`)
            .then(async (response) => response.ok ? response.json() : null).catch(() => null));
        }
        return grammarExamplesCache.get(lessonNo);
      }

      function sentenceParts(value) {
        return String(value).split(/([\u3400-\u9fff々０-９0-9]+)\[([^\[\]]+)\]/g);
      }

      function renderSentence(value) {
        const parts = sentenceParts(sentenceText(value));
        return parts.map((part, index) => index % 3 === 1
          ? `<ruby>${escapeHtml(part)}<rt>${escapeHtml(parts[index + 1])}</rt></ruby>`
          : index % 3 === 2 ? "" : escapeHtml(part)).join("");
      }

      function sentenceText(value) {
        const text = value && typeof value === "object" ? (value.jp || value.text || "") : value;
        return String(text || "").replace(/\[[^\[\]]+\]/g, "");
      }

      function renderGrammarExamples(pageNo, data) {
        const page = data?.pages?.[pageNo];
        if (!page?.groups?.length) return `<div class="grammar-examples grammar-empty">${escapeHtml(page?.emptyMessage || "本页例句尚未整理，待站点维护者批量升级后查看。")}</div>`;
        return `<div class="grammar-examples">${page.groups.map((group, groupIndex) => `<section class="grammar-group inline-notes-container">
          <h3>${escapeHtml(group.title)}</h3>
          ${group.examples.map((example) => `<div class="grammar-example ${example.incorrect ? "incorrect" : ""}">
            ${example.note ? `<div class="grammar-note">${escapeHtml(example.note)}</div>` : ""}
            ${example.sentences.map((sentence) => `<div role="button" tabindex="0" class="grammar-sentence text-cell" data-sentence="${escapeHtml(sentenceText(sentence))}" aria-label="朗读：${escapeHtml(sentenceText(sentence))}"><span class="jp" lang="ja">${renderSentence(sentence)}</span></div>`).join("")}
          </div>`).join("")}
          <div class="inline-notes-host" data-inline-notes-key="japaflow.grammar.groupNotes.v1:${selectedLessonNo()}:${pageNo}:${escapeHtml(group.id || groupIndex)}" data-notes-lesson="${selectedLessonNo()}" data-notes-item="${pageNo}:${escapeHtml(group.id || groupIndex)}" data-notes-context="${escapeHtml([group.title, ...group.examples.flatMap(example => example.sentences.map(sentenceText))].join('\n'))}"></div>
        </section>`).join("")}</div>`;
      }
      const vocabularyAudio = new Audio();
      let vocabularyStopHandler = null;
      const grammarVocabularyCollapsePrefix = "japaflow:grammar-vocabulary-collapsed:";

      function isMobileImageViewer() { return window.matchMedia("(max-width: 920px) and (hover: none), (max-width: 920px) and (pointer: coarse)").matches; }
      function updateImageZoom() { imageLightboxImage.style.transform = `scale(${imageZoom})`; }
      function closeImageLightbox() { imageLightbox.classList.remove("open"); imageLightbox.setAttribute("aria-hidden", "true"); imageLightboxImage.removeAttribute("src"); }
      function openImageLightbox(image) {
        if (!isMobileImageViewer()) return;
        imageZoom = 1;
        imageLightboxImage.src = image.currentSrc || image.src;
        imageLightboxImage.alt = image.alt;
        updateImageZoom();
        imageLightbox.classList.add("open");
        imageLightbox.setAttribute("aria-hidden", "false");
      }

      function selectedLessonNo() {
        const params = new URLSearchParams(location.search);
        const raw = params.get("lesson") || params.get("lessonId") || params.get("lessonNo") || "";
        const queryMatch = String(raw).match(/\d+/);
        if (queryMatch) {
          const lessonNo = Number(queryMatch[0]);
          if (Number.isFinite(lessonNo)) return Math.max(1, Math.min(48, Math.floor(lessonNo)));
        }
        const match = location.hash.match(/lesson=(\d+)/);
        const lessonNo = Number(match ? match[1] : 1);
        if (!Number.isFinite(lessonNo)) return 1;
        return Math.max(1, Math.min(48, Math.floor(lessonNo)));
      }

      function imagePath(lessonNo, pageNo) {
        return `../course-assets/by-lesson/lesson${lessonNo}/page${pageNo}.webp`;
      }

      function vocabularyDataPath(lessonNo) {
        return `../data/ocr/lesson${lessonNo}-grammar-vocabulary-occurrences.json`;
      }

      function vocabularyListPath(lessonNo) {
        return `../data/ocr/lesson${lessonNo}-vocabulary-audio-verified.json`;
      }

      function escapeHtml(value) {
        return String(value ?? "").replace(/[&<>\"']/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#039;" })[char]);
      }

      function hasKanji(value) { return /[\u3400-\u9fff]/.test(value || ""); }

      function collapseKey(lessonNo, pageNo) {
        return `${grammarVocabularyCollapsePrefix}lesson${lessonNo}:page${pageNo}`;
      }

      function pageModeKey(lessonNo, pageNo) {
        return `japaflow:grammar-page-mode:lesson${lessonNo}:page${pageNo}`;
      }

      function pageMode(lessonNo, pageNo) {
        return localStorage.getItem(pageModeKey(lessonNo, pageNo)) === "listen" ? "listen" : "source";
      }

      function isVocabularyCollapsed(lessonNo, pageNo) {
        return localStorage.getItem(collapseKey(lessonNo, pageNo)) !== "false";
      }

      async function loadGrammarVocabulary(lessonNo) {
        if (grammarVocabularyCache.has(lessonNo)) return grammarVocabularyCache.get(lessonNo);
        const promise = Promise.all([fetch(vocabularyDataPath(lessonNo)), fetch(vocabularyListPath(lessonNo))])
          .then(async ([occurrencesResponse, vocabularyResponse]) => {
            if (!occurrencesResponse.ok || !vocabularyResponse.ok) return null;
            return { occurrences: await occurrencesResponse.json(), words: (await vocabularyResponse.json()).vocabulary || [] };
          })
          .catch(() => null);
        grammarVocabularyCache.set(lessonNo, promise);
        return promise;
      }

      function renderGrammarVocabulary(lessonNo, pageNo, data) {
        if (data?.occurrences?.reviewStatus !== "approved") return "";
        const ids = data?.occurrences?.pages?.[pageNo]?.wordIds;
        const words = Array.isArray(ids) ? ids.map((id) => ({ id, word: data.words[id - 1] })).filter((item) => item.word) : [];
        if (!words.length) return "";
        const collapsed = isVocabularyCollapsed(lessonNo, pageNo);
        const chips = words.map(({ id, word }) => {
          const writing = word.writing || word.kana || "";
          const japanese = word.kana && hasKanji(writing) ? `<ruby>${escapeHtml(writing)}<rt>${escapeHtml(word.kana)}</rt></ruby>` : escapeHtml(writing);
          return `<span class="grammar-vocabulary-chip-wrap"><button class="grammar-vocabulary-chip" type="button" data-vocabulary-index="${id}" title="播放单词发音"><span>${japanese}</span><span class="grammar-vocabulary-meaning">${escapeHtml((word.meaningZh || []).join("；"))}</span>${word.partOfSpeech ? `<span class="grammar-vocabulary-pos">${escapeHtml(word.partOfSpeech)}</span>` : ""}</button></span>`;
        }).join("");
        return `<section class="grammar-vocabulary" aria-label="本页生词">
          <button class="grammar-vocabulary-toggle" type="button" data-toggle-vocabulary="${pageNo}" aria-expanded="${!collapsed}">
            <strong>本页生词 · ${words.length}</strong><span>${collapsed ? "▸" : "▾"}</span>
          </button>
          ${collapsed ? "" : `<div class="grammar-vocabulary-items">${chips}</div>`}
        </section>`;
      }

      function playVocabularyWord(word, button) {
        stopSentence();
        const segment = word?.audioSegment;
        const url = segment?.sourceUrl;
        if (!url) return;
        vocabularyAudio.pause();
        if (vocabularyStopHandler) vocabularyAudio.removeEventListener("timeupdate", vocabularyStopHandler);
        vocabularyAudio.src = url;
        vocabularyAudio.currentTime = Number(segment.start) || 0;
        document.querySelectorAll(".grammar-vocabulary-chip.playing").forEach((item) => item.classList.remove("playing"));
        button.classList.add("playing");
        const stopAt = Number(segment.end) || 0;
        const stop = () => {
          if (stopAt && vocabularyAudio.currentTime >= stopAt) { vocabularyAudio.pause(); vocabularyAudio.removeEventListener("timeupdate", stop); vocabularyStopHandler = null; button.classList.remove("playing"); }
        };
        vocabularyStopHandler = stop;
        vocabularyAudio.addEventListener("timeupdate", stop);
        vocabularyAudio.addEventListener("ended", () => button.classList.remove("playing"), { once: true });
        vocabularyAudio.play().catch(() => button.classList.remove("playing"));
      }

      function renderLessons(activeLessonNo) {
        lessonGrid.innerHTML = lessons.map((lesson) => `
          <button class="lesson-entry ${lesson.lessonNo === activeLessonNo ? "active" : ""}" type="button" data-lesson="${lesson.lessonNo}">
            <span class="lesson-no">${lesson.lessonNo}</span>
            <span class="lesson-meta">
              <span>第${lesson.lessonNo}课</span>
              <small>${lesson.pages[0]}-${lesson.pages[lesson.pages.length - 1]}</small>
            </span>
          </button>
        `).join("");
      }

      async function renderViewer(activeLessonNo) {
        stopSentence();
        vocabularyAudio.pause();
        const lesson = lessons[activeLessonNo - 1];
        const [vocabularyData, examplesData, audioManifest] = await Promise.all([
          loadGrammarVocabulary(activeLessonNo), loadGrammarExamples(activeLessonNo),
          fetch(`../data/ocr/lesson${activeLessonNo}-grammar-audio.json`).then((response) => response.ok ? response.json() : null).catch(() => null)
        ]);
        if (activeLessonNo !== selectedLessonNo()) return;
        grammarAudioManifest = audioManifest;
        summary.textContent = `第 ${activeLessonNo} 课 · ${lesson.pages.length} 张`;
        viewer.innerHTML = `
          <div class="grammar-note">
            <div id="speechStatus" role="status" aria-live="polite">${audioManifest ? "标准例句音频已就绪。点击句子播放，再次点击停止。" : "本课标准例句音频尚未生成。"}</div>
          </div>
          <div class="image-stack">
            ${lesson.pages.map((pageNo, index) => `
              <figure class="image-frame" data-page-mode="${pageMode(activeLessonNo, pageNo)}">
                <div class="grammar-page-mode" role="group" aria-label="第 ${pageNo} 页查看模式">
                  <button type="button" class="${pageMode(activeLessonNo, pageNo) === "source" ? "active" : ""}" data-page-mode="source" data-page-no="${pageNo}" aria-pressed="${pageMode(activeLessonNo, pageNo) === "source"}">看语法</button>
                  <button type="button" class="${pageMode(activeLessonNo, pageNo) === "listen" ? "active" : ""}" data-page-mode="listen" data-page-no="${pageNo}" aria-pressed="${pageMode(activeLessonNo, pageNo) === "listen"}">读句子</button>
                </div>
                <div class="grammar-source">
                <img src="${imagePath(activeLessonNo, pageNo)}" alt="第${activeLessonNo}课 Page ${pageNo}" loading="lazy" onerror="this.closest('.image-frame').classList.add('missing')" />
                <div class="image-error">图片不存在：lesson${activeLessonNo}/page${pageNo}.webp</div>
                </div>
                <div class="grammar-interaction" aria-label="第 ${pageNo} 页交互区域">
                  ${renderGrammarVocabulary(activeLessonNo, pageNo, vocabularyData)}
                  ${renderGrammarExamples(pageNo, examplesData)}
                </div>
              </figure>
            `).join("")}
          </div>
        `;
        window.mountInlineNotes?.();
      }

      function render() {
        const activeLessonNo = selectedLessonNo();
        renderLessons(activeLessonNo);
        renderViewer(activeLessonNo);
      }

      lessonGrid.addEventListener("click", (event) => {
        const button = event.target.closest("[data-lesson]");
        if (!button) return;
        location.hash = `lesson=${button.dataset.lesson}`;
      });

      viewer.addEventListener("click", (event) => {
        const pageModeButton = event.target.closest("button[data-page-mode]");
        if (pageModeButton) {
          const lesson = selectedLessonNo();
          localStorage.setItem(pageModeKey(lesson, pageModeButton.dataset.pageNo), pageModeButton.dataset.pageMode);
          renderViewer(lesson);
          return;
        }
        const sentence = event.target.closest("[data-sentence]");
        if (sentence) {
          if (window.getSelection()?.toString() || event.detail > 1) return;
          playSentence(sentence); return;
        }
        const toggle = event.target.closest("[data-toggle-vocabulary]");
        if (toggle) {
          const lesson = selectedLessonNo();
          const pageNo = toggle.dataset.toggleVocabulary;
          const collapsed = toggle.getAttribute("aria-expanded") === "true";
          localStorage.setItem(collapseKey(lesson, pageNo), String(collapsed));
          renderViewer(lesson);
          return;
        }
        const vocabularyButton = event.target.closest("[data-vocabulary-index]");
        if (vocabularyButton) {
          const lesson = selectedLessonNo();
          loadGrammarVocabulary(lesson).then((data) => playVocabularyWord(data?.words?.[Number(vocabularyButton.dataset.vocabularyIndex) - 1], vocabularyButton));
          return;
        }
        const image = event.target.closest(".image-frame img");
        if (image) openImageLightbox(image);
      });
      viewer.addEventListener("keydown", (event) => {
        const sentence = event.target.closest(".grammar-sentence");
        if (!sentence || !["Enter", " "].includes(event.key)) return;
        event.preventDefault();
        playSentence(sentence);
      });
      viewer.addEventListener("copy", (event) => {
        const selection = window.getSelection();
        if (!selection?.rangeCount || selection.isCollapsed || !event.clipboardData) return;
        const range = selection.getRangeAt(0);
        const element = node => node.nodeType === Node.ELEMENT_NODE ? node : node.parentElement;
        if (!element(range.startContainer)?.closest('.grammar-examples') || !element(range.endContainer)?.closest('.grammar-examples')) return;
        if (element(range.startContainer)?.closest('.inline-notes-host') || element(range.endContainer)?.closest('.inline-notes-host')) return;
        const fragment = range.cloneContents();
        fragment.querySelectorAll('rt, rp').forEach(node => node.remove());
        fragment.querySelectorAll('.grammar-sentence').forEach(node => node.append('\n'));
        event.clipboardData.setData('text/plain', fragment.textContent.trim());
        event.preventDefault();
      });
      imageLightbox.addEventListener("click", (event) => {
        const zoom = event.target.closest("[data-image-zoom]");
        if (zoom) {
          const action = zoom.dataset.imageZoom;
          imageZoom = action === "in" ? Math.min(3, imageZoom + 0.25) : action === "out" ? Math.max(0.75, imageZoom - 0.25) : 1;
          updateImageZoom();
          return;
        }
        if (event.target.closest("[data-image-lightbox-close]") || event.target === imageLightbox) closeImageLightbox();
      });
      window.addEventListener("keydown", (event) => { if (event.key === "Escape") closeImageLightbox(); });

      window.addEventListener("hashchange", render);
      render();
    </script>
  </body>
</html>
