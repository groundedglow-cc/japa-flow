<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>课程详情学习路径</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f5f7f8;
        --panel: #ffffff;
        --ink: #17202a;
        --muted: #657181;
        --line: #d9dee5;
        --accent: #1f7a5b;
        --accent-strong: #166248;
        --accent-soft: #e6f3ee;
        --warn: #9a5b16;
        --shadow: 0 18px 44px rgba(23, 32, 42, 0.08);
      }

      * {
        box-sizing: border-box;
      }

      body {
        position: relative;
        isolation: isolate;
        margin: 0;
        min-height: 100vh;
        background: #08121b;
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body::before,
      body::after {
        position: fixed;
        z-index: 0;
        top: -18vh;
        bottom: -18vh;
        width: min(24vw, 340px);
        content: "";
        pointer-events: none;
        background: #123748;
        border: 1px solid rgba(105, 199, 215, 0.18);
        opacity: 0.74;
        animation: ambient-side-drift 24s ease-in-out infinite alternate;
      }

      body::before {
        left: -90px;
        transform: rotate(-8deg);
      }

      body::after {
        right: -90px;
        transform: rotate(8deg);
        animation-delay: -12s;
      }

      @keyframes ambient-side-drift {
        from { translate: 0 -3%; }
        to { translate: 0 5%; }
      }

      @media (prefers-reduced-motion: reduce) {
        body::before,
        body::after {
          animation: none;
        }
      }

      button,
      input {
        font: inherit;
      }

      button {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        color: var(--ink);
        cursor: pointer;
      }

      button:disabled {
        cursor: default;
        opacity: 0.55;
      }

      a {
        color: var(--accent);
        text-decoration: none;
      }

      .shell {
        position: relative;
        z-index: 1;
        display: grid;
        grid-template-rows: auto 1fr;
        min-height: 100vh;
      }

      .topbar {
        position: sticky;
        top: 0;
        z-index: 20;
        display: flex;
        gap: 18px;
        align-items: center;
        justify-content: space-between;
        padding: 14px 18px;
        border-bottom: 1px solid var(--line);
        background: rgba(242, 247, 249, 0.94);
        backdrop-filter: blur(10px);
      }

      .title-block {
        flex: 1 1 260px;
        min-width: 0;
      }

      .home-nav {
        display: flex;
        align-items: center;
        gap: 4px;
        flex: 0 0 auto;
      }

      .home-nav a {
        padding: 9px 12px;
        border-radius: 8px;
        color: var(--muted);
        font-size: 14px;
        font-weight: 650;
        white-space: nowrap;
      }

      .home-nav a:hover,
      .home-nav a.active {
        background: #e8f2ee;
        color: var(--accent);
      }

      .topbar-start {
        display: flex;
        align-items: center;
        gap: 18px;
        flex: 1 1 420px;
        min-width: 0;
      }

      .course-brand {
        display: inline-flex;
        align-items: center;
        flex: 0 0 auto;
        gap: 10px;
        color: var(--ink);
        font-weight: 800;
      }

      .course-brand:hover {
        color: var(--accent);
      }

      .course-brand-mark {
        display: grid;
        width: 30px;
        height: 30px;
        place-items: center;
        border-radius: 8px;
        background: #18201d;
        color: #fff;
        font-weight: 900;
      }

      h1 {
        margin: 0;
        font-size: 22px;
        line-height: 1.22;
        letter-spacing: 0;
      }

      .lesson-form {
        display: flex;
        align-items: center;
        gap: 8px;
        flex: 1 1 260px;
        justify-content: flex-end;
        min-width: 0;
      }

      .lesson-form label {
        color: var(--muted);
        font-size: 13px;
        white-space: nowrap;
      }

      .lesson-form input {
        width: 76px;
        height: 38px;
        padding: 0 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
        color: var(--ink);
      }

      .lesson-form button {
        min-height: 38px;
        padding: 0 13px;
      }

      .lesson-form button.primary {
        border-color: var(--accent);
        background: var(--accent);
        color: #fff;
      }

      .main {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 16px;
        width: min(100% - 28px, 1440px);
        min-height: calc(100vh - 67px);
        margin: 0 auto;
        padding: 16px 0 20px;
        background: #fff;
        border-right: 1px solid rgba(170, 197, 204, 0.58);
        border-left: 1px solid rgba(170, 197, 204, 0.58);
        box-shadow: 0 28px 72px rgba(0, 0, 0, 0.22);
      }

      .course-tabs {
        display: flex;
        align-items: center;
        min-height: 46px;
        padding: 0 14px;
        border-bottom: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.94);
      }

      .viewer-shell {
        min-width: 0;
      }

      .step-list {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 16px;
        align-items: center;
        flex: 0 0 auto;
        justify-content: center;
        min-width: 220px;
      }

      .step-button {
        display: inline-flex;
        align-items: center;
        gap: 0;
        min-height: 0;
        padding: 0;
        border: 0;
        border-radius: 0;
        background: transparent;
        color: var(--muted);
        box-shadow: none;
        font-size: 14px;
        font-weight: 650;
        line-height: 1.4;
        text-align: center;
        white-space: nowrap;
      }

      .step-button.active {
        color: var(--accent);
        text-decoration: underline;
        text-underline-offset: 4px;
      }

      .step-copy {
        display: inline;
        min-width: 0;
      }

      .step-copy strong {
        font-size: 14px;
      }

      .viewer-shell {
        display: grid;
        grid-template-rows: minmax(680px, calc(100vh - 150px));
      }

      .iframe-stage {
        position: relative;
        min-height: 680px;
        overflow: hidden;
        border-radius: 8px;
        background: #fff;
        box-shadow: var(--shadow);
      }

      .frame-wrap {
        position: absolute;
        inset: 0;
        display: none;
      }

      .frame-wrap.active {
        display: block;
      }

      .frame-wrap iframe {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
        background: #fff;
      }

      .empty-state {
        display: grid;
        place-items: center;
        min-height: 420px;
        color: var(--muted);
        text-align: center;
        padding: 32px;
      }

      @media (max-width: 980px) {
        body::before,
        body::after {
          display: none;
        }

        .topbar {
          flex-wrap: wrap;
          align-items: flex-start;
        }

        .topbar-start {
          flex: 1 1 100%;
        }

        .lesson-form {
          justify-content: flex-end;
        }

        .step-list {
          overflow-x: auto;
          flex-wrap: nowrap;
          order: 3;
          justify-content: flex-start;
          width: 100%;
        }

        .viewer-shell {
          grid-template-rows: auto minmax(620px, calc(100vh - 180px));
        }

        .iframe-stage {
          min-height: 620px;
        }
      }

      @media (max-width: 640px) {
        .topbar {
          padding: 12px;
        }

        .topbar-start {
          gap: 12px;
        }

        .course-brand {
          font-size: 14px;
        }

        .main {
          width: min(100% - 16px, 1440px);
          padding-top: 10px;
        }

        .lesson-form {
          align-items: stretch;
        }

        .lesson-form {
          flex-direction: column;
        }

        .lesson-form input,
        .lesson-form button {
          width: 100%;
        }

        .step-list {
          gap: 12px;
        }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div class="topbar-start">
          <a class="course-brand" href="/" aria-label="返回 JapaFlow 首页">
            <span class="course-brand-mark">日</span>
            <span>JapaFlow</span>
          </a>
          <div class="title-block">
            <h1 id="pageTitle">课程详情</h1>
          </div>
        </div>
        <nav class="home-nav" aria-label="主导航">
          <a href="/">首页</a>
          <a href="/favorites">收藏</a>
          <a href="/help">帮助</a>
        </nav>
        <form class="lesson-form" id="lessonForm">
          <label for="lessonInput">课程编号</label>
          <input id="lessonInput" name="lesson" type="number" min="1" max="48" step="1" />
          <button class="primary" type="submit">切换课程</button>
        </form>
      </header>

      <main class="main">
        <nav class="course-tabs">
          <div class="step-list" id="stepList"></div>
        </nav>
        <section class="viewer-shell">
          <div class="iframe-stage" id="iframeStage">
            <div class="empty-state">正在加载课程...</div>
          </div>
        </section>
      </main>
    </div>

    <script>
      const parts = [
        {
          id: "vocabulary",
          label: "单词",
          title: "单词预览",
          description: "使用 OCR 词汇数据预览单词、释义和教材原图。",
          originKey: "vocabularyOrigin",
          groupKey: "contentOrigin",
          path: (lessonNo) => `/tools/vocabulary-import-preview.html?lesson=${lessonNo}&lessonId=lesson${lessonNo}&embedded=1`
        },
        {
          id: "grammar",
          label: "语法",
          title: "语法学习",
          description: "查看本课第 2-6 张教材图片完成语法学习。",
          originKey: "grammarOrigin",
          groupKey: "appOrigin",
          path: (lessonNo) => `/tools/grammar-image-preview.html?lesson=${lessonNo}&lessonId=lesson${lessonNo}&embedded=1`
        },
        {
          id: "text",
          label: "课文",
          title: "课文预览",
          description: "使用 OCR 课文数据预览基本课文和应用课文。",
          originKey: "textOrigin",
          groupKey: "contentOrigin",
          path: (lessonNo) => `/tools/text-import-preview.html?lesson=${lessonNo}&lessonId=lesson${lessonNo}&embedded=1`
        },
        {
          id: "practice",
          label: "练习",
          title: "练习",
          description: "进入新版练习页完成提交、判分和候选答案复核。",
          originKey: "practiceOrigin",
          groupKey: "appOrigin",
          path: (lessonNo) => `/practice/lesson${lessonNo}-practice-preview.html?lesson=${lessonNo}&lessonId=lesson${lessonNo}&embedded=1`
        }
      ];

      const state = {
        lessonNo: lessonNoFromLocation(),
        activePart: partFromLocation(),
        loadedFrames: new Set()
      };

      const $ = (selector) => document.querySelector(selector);

      function lessonNoFromLocation() {
        const params = new URLSearchParams(location.search);
        const raw = params.get("lesson") || params.get("lessonId") || params.get("lessonNo") || "";
        const match = String(raw).match(/\d+/);
        const lessonNo = Number(match ? match[0] : 1);
        if (!Number.isFinite(lessonNo)) return 1;
        return Math.max(1, Math.min(48, Math.floor(lessonNo)));
      }

      function partFromLocation() {
        const params = new URLSearchParams(location.search);
        const value = params.get("part") || params.get("step") || "vocabulary";
        return parts.some((part) => part.id === value) ? value : "vocabulary";
      }

      function srcFor(part, lessonNo = state.lessonNo) {
        const target = new URL(part.path(lessonNo), location.origin);
        if (new URLSearchParams(location.search).get("admin") === "1") {
          target.searchParams.set("admin", "1");
        }
        return target.toString();
      }

      function updateUrl() {
        const params = new URLSearchParams(location.search);
        params.set("lesson", String(state.lessonNo));
        params.set("part", state.activePart);
        history.replaceState(null, "", `${location.pathname}?${params.toString()}`);
      }

      function renderSteps() {
        $("#stepList").innerHTML = parts.map((part) => `
          <a class="step-button ${part.id === state.activePart ? "active" : ""}" href="?lesson=${state.lessonNo}&part=${part.id}" data-part="${part.id}">
            <span class="step-copy">
              <strong>${part.label}</strong>
            </span>
          </a>
        `).join("");
      }

      function ensureFrame(part) {
        const id = `frame-${part.id}`;
        let wrap = document.getElementById(id);
        if (wrap) return wrap;
        wrap = document.createElement("div");
        wrap.className = "frame-wrap";
        wrap.id = id;
        const iframe = document.createElement("iframe");
        iframe.title = part.title;
        iframe.loading = "lazy";
        iframe.allow = "microphone; autoplay; clipboard-read; clipboard-write";
        iframe.src = srcFor(part);
        wrap.appendChild(iframe);
        $("#iframeStage").appendChild(wrap);
        state.loadedFrames.add(part.id);
        return wrap;
      }

      function renderFrame() {
        const active = parts.find((part) => part.id === state.activePart) || parts[0];
        if (!state.loadedFrames.size) $("#iframeStage").innerHTML = "";
        parts.forEach((part) => {
          const wrap = part.id === active.id ? ensureFrame(part) : document.getElementById(`frame-${part.id}`);
          if (wrap) wrap.classList.toggle("active", part.id === active.id);
        });
      }

      function render() {
        $("#pageTitle").textContent = `标日初级第${state.lessonNo}课`;
        $("#lessonInput").value = String(state.lessonNo);
        renderSteps();
        renderFrame();
        updateUrl();
      }

      function switchPart(partId) {
        if (!parts.some((part) => part.id === partId)) return;
        state.activePart = partId;
        render();
      }

      function rebuildFramesForLesson() {
        state.loadedFrames.clear();
        $("#iframeStage").innerHTML = `<div class="empty-state">正在加载第 ${state.lessonNo} 课...</div>`;
      }

      $("#stepList").addEventListener("click", (event) => {
        const link = event.target.closest("[data-part]");
        if (!link) return;
        event.preventDefault();
        switchPart(link.dataset.part);
      });

      $("#lessonForm").addEventListener("submit", (event) => {
        event.preventDefault();
        const nextLessonNo = Math.max(1, Math.min(48, Math.floor(Number($("#lessonInput").value) || 1)));
        if (nextLessonNo === state.lessonNo) return;
        state.lessonNo = nextLessonNo;
        rebuildFramesForLesson();
        render();
      });

      render();
    </script>
  </body>
</html>
